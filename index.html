<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>옆 학교는? · 공문 판별부터 옆 학교 판단까지</title>
<meta name="description" content="공문은 판별기로 주관·협조 담당을 바로 확인하고, 애매하면 옆 학교에 묻는 초등학교 업무 판단 서비스. 학교별 1표로 판단이 쌓여요.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#F4F6FB;--card:#fff;--ink:#1A1F2C;--sub:#596277;--mute:#9AA2B2;--line:#E6E9F1;--line2:#D5DAE6;
  --pri:#4C6EF5;--pri-ink:#2C46B8;--pri-soft:#EEF2FF;--navy:#1F2A5A;
  --ok:#0CA678;--ok-soft:#E6F7F0;--warn:#E67700;--warn-soft:#FFF4E0;--bad:#E03131;--bad-soft:#FFEDED;
  --r:18px;--shadow:0 1px 2px rgba(20,30,60,.04),0 4px 16px rgba(20,30,60,.05);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.6;word-break:keep-all;padding-bottom:40px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--pri-ink)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
/* header */
header{position:sticky;top:0;z-index:30;background:rgba(244,246,251,.86);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid transparent}
header.scrolled{border-bottom-color:var(--line)}
.hd{display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;font-weight:800;font-size:19px;letter-spacing:-.4px}
.logo .lt{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2;text-align:left}
.logo .lt b{font-size:18px;font-weight:800;letter-spacing:-.4px}
.logo .lt small{font-size:11.5px;font-weight:600;color:var(--mute);letter-spacing:-.2px;margin-top:1px}
@media (max-width:330px){.logo .lt small{display:none}}
.logo .mk{width:30px;height:30px;border-radius:9px;background:var(--pri);display:grid;place-items:center}
.nav{display:flex;gap:4px}
.nav button{background:none;border:0;padding:8px 12px;border-radius:10px;color:var(--sub);font-weight:600;font-size:14px}
.nav button.on{color:var(--ink);background:#fff;box-shadow:var(--shadow)}
.nav button.cta{background:var(--navy);color:#fff}
.nav button.cta.on{background:var(--pri);box-shadow:none}
/* bottom nav (mobile) */
.bnav{display:none}
@media (max-width:640px){
  .nav{display:none}
  body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
  .bnav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--mute);font-weight:600;padding:4px 0}
  .bnav button.on{color:var(--ink)}
  .bnav .plus{width:42px;height:30px;border-radius:12px;background:var(--navy);color:#fff;display:grid;place-items:center}
}
/* common */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.sec{margin-top:16px}
h1,h2,h3{letter-spacing:-.5px;margin:0}
.sub{color:var(--sub)}
.muted{color:var(--mute)}
.small{font-size:13px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:#F0F2F7;color:var(--sub);white-space:nowrap}
.pill.pri{background:var(--pri-soft);color:var(--pri-ink)}
.pill.ok{background:var(--ok-soft);color:#087F5B}
.pill.warn{background:var(--warn-soft);color:#B35C00}
.pill.bad{background:var(--bad-soft);color:#B42424}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line2);background:#fff;font-weight:700;font-size:14.5px;transition:transform .08s,background .15s}
.btn:active{transform:scale(.98)}
.btn:hover{background:#F8F9FC}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:#3F5FE0}
.btn.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.dark:hover{background:#2A376F}
a.btn{text-decoration:none;color:var(--ink)}
.btn.block{width:100%}
.btn.sm{height:36px;padding:0 12px;font-size:13.5px;border-radius:10px}
.link{background:none;border:0;padding:0;color:var(--pri-ink);font-weight:600;font-size:13.5px;text-decoration:underline;text-underline-offset:3px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:8px}
/* hero */
.hero{margin-top:12px;background:var(--navy);color:#fff;border-radius:22px;padding:26px 22px 22px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:#4C6EF5;opacity:.45}
.hero:before{content:"";position:absolute;right:60px;bottom:-90px;width:160px;height:160px;border-radius:50%;background:#12B886;opacity:.28}
.hero>*{position:relative;z-index:1}
.hero .eyebrow{font-size:12.5px;font-weight:700;color:#B7C4FF;margin:0 0 8px}
.hero h1{font-size:27px;line-height:1.3;font-weight:800}
.hero p{color:#D3DAF5;margin:10px 0 0;font-size:14.5px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.stat{background:rgba(255,255,255,.1);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-size:21px;font-weight:800}
.stat span{font-size:12px;color:#C4CDEE}
/* page head: 모든 페이지 머리 같은 틀 (작은 분류 → 큰 제목 → 한 줄 설명) */
.phead{padding:22px 2px 4px}
.phead .eb{font-size:12.5px;font-weight:700;color:var(--pri-ink);margin:0 0 6px}
.phead h1{font-size:24px;line-height:1.35;font-weight:800}
.phead p{color:var(--sub);font-size:14px;margin:6px 0 0;line-height:1.6}
.pstats{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.pstats span{background:#fff;box-shadow:var(--shadow);border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--sub)}
.pstats b{color:var(--ink);font-weight:800;margin-right:3px}
.hero.jhero h1{font-size:26px}
.hsteps{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px;padding:0;list-style:none}
.hsteps li{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.1);border-radius:999px;padding:6px 12px 6px 6px;font-size:12.5px;font-weight:600;color:#E3E8FA}
.hsteps i{font-style:normal;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:11.5px;font-weight:800;color:#fff}
.jcardtop{margin-top:-14px;position:relative;z-index:2;border-top-left-radius:16px;border-top-right-radius:16px}
@media (max-width:560px){.hero.jhero{padding:22px 18px 30px}.hero.jhero h1{font-size:23px}}
.mytabs{display:flex;gap:4px;background:#E9ECF3;border-radius:12px;padding:4px;margin-top:16px}
.mytabs button{flex:1;border:0;background:none;border-radius:9px;padding:9px 4px;font-weight:700;font-size:14px;color:var(--sub)}
.mytabs button span{color:var(--mute);font-weight:600;margin-left:2px}
.mytabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(20,30,60,.12)}
.mytabs button.on span{color:var(--pri)}
.empty-guide{text-align:center;padding:30px 20px}
.empty-guide b{font-size:16px}
.empty-guide p{margin:6px 0 16px}
/* search */
.search{display:flex;align-items:center;gap:8px;background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:0 14px;height:50px;border:1.5px solid transparent}
.search:focus-within{border-color:var(--pri)}
.search input{flex:1;border:0;outline:0;background:none;font-size:15px;min-width:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line2);background:#fff;border-radius:999px;padding:6px 13px;font-size:13.5px;font-weight:600;color:var(--sub)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.tools{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:8px 0 10px}
.sel{height:34px;border:1px solid var(--line2);border-radius:10px;background:#fff;padding:0 10px;font-size:13px;font-weight:600;color:var(--sub)}
/* agenda cards */
.alist{display:grid;gap:10px}
.acard{display:block;width:100%;text-align:left;background:#fff;border:0;border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;transition:transform .12s}
.acard:hover{transform:translateY(-1px)}
.acard h3{font-size:16.5px;font-weight:700;line-height:1.45;margin:8px 0 10px}
.acard .meta{font-size:12.5px;color:var(--mute);display:flex;gap:10px;flex-wrap:wrap}
.stack{display:flex;height:8px;border-radius:5px;overflow:hidden;background:#EEF0F5;margin-bottom:8px}
.stack i{display:block;height:100%}
.peek{position:relative;height:30px;margin-bottom:8px;display:flex;align-items:center}
.peek .stack{width:100%;height:10px;margin:0;filter:blur(3px);opacity:.45}
.peek em{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border-radius:999px;padding:3px 11px;font-style:normal;font-size:12px;font-weight:600;color:var(--sub);box-shadow:0 1px 4px rgba(20,30,60,.12);display:flex;gap:5px;align-items:center;white-space:nowrap;max-width:calc(100% - 8px);overflow:hidden;text-overflow:ellipsis}
.hidden-res{font-size:12.5px;color:var(--sub);background:#F4F6FB;border-radius:10px;padding:7px 10px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.empty{text-align:center;padding:36px 16px;color:var(--sub)}
.sech{display:flex;align-items:baseline;justify-content:space-between;margin:26px 2px 10px}
.sech h2{font-size:18px;font-weight:800;white-space:nowrap}
.sech{flex-wrap:wrap;column-gap:10px;row-gap:2px}
.prog{display:flex;gap:4px;margin-top:2px}
.prog i{width:22px;height:6px;border-radius:3px;background:#E3E7F0}
.prog i.on{background:var(--ok)}
/* agenda detail */
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--sub);font-weight:600;padding:12px 0 4px;font-size:14px}
.ahead h1{font-size:24px;line-height:1.4;font-weight:800;margin:10px 0 8px}
.ahead .desc{color:var(--sub);margin:0 0 12px;white-space:pre-wrap}
.panel{border-radius:16px;padding:16px;background:var(--pri-soft);margin-top:14px}
.panel.warn{background:var(--warn-soft)}
.panel.mine{background:var(--ok-soft)}
.panel .t{font-weight:700;font-size:15.5px;margin:0 0 4px}
.panel p{margin:0 0 12px;font-size:13.5px;color:var(--sub)}
.panel .acts{display:grid;gap:8px}
@media (min-width:560px){.panel .acts.three{grid-template-columns:1fr 1fr 1fr}}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700;background:#fff;border-radius:8px;padding:2px 8px;font-size:13px;white-space:nowrap}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--sub);cursor:pointer;user-select:none}
.toggle input{display:none}
.toggle .sw{width:36px;height:21px;border-radius:999px;background:#D5DAE6;position:relative;transition:.15s}
.toggle .sw:after{content:"";position:absolute;left:3px;top:3px;width:15px;height:15px;border-radius:50%;background:#fff;transition:.15s}
.toggle input:checked+.sw{background:var(--ok)}
.toggle input:checked+.sw:after{left:18px}
.bars{display:grid;gap:14px;margin-top:16px}
.bar .lab{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:6px}
.bar .lab b{font-weight:800}
.bar .lab .n{color:var(--mute);font-size:12.5px;font-weight:500;margin-left:4px}
.bar .tr{height:14px;border-radius:7px;background:#EEF0F5;overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:7px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar.top .lab span:first-child{font-weight:700}
.note{font-size:12.5px;color:var(--mute);margin-top:12px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px;max-width:420px}
.tile{aspect-ratio:1.35/1;border-radius:12px;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:#EEF0F5;color:var(--mute);padding:0}
.tile small{font-size:11px;font-weight:600;opacity:.85}
.tile.has{color:#fff}
.tile.sel{outline:3px solid var(--ink);outline-offset:1px}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:var(--sub)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.cmp{display:grid;gap:12px;margin-top:12px}
.cmp .o{font-size:13.5px;font-weight:600;margin-bottom:4px}
.cmp .ln{display:grid;grid-template-columns:62px 1fr 40px;align-items:center;gap:8px;font-size:12px;color:var(--mute);margin-top:3px}
.cmp .ln .tr{height:8px;border-radius:4px;background:#EEF0F5;overflow:hidden}
.cmp .ln .tr i{display:block;height:100%;border-radius:4px}
.minor{border-radius:16px;background:#FFF8E6;padding:16px;margin-top:16px}
.minor .k{font-size:12.5px;font-weight:700;color:#B35C00;display:flex;align-items:center;gap:6px;margin-bottom:6px}
.minor q{display:block;font-size:15px;line-height:1.65;quotes:none;margin-bottom:8px}
.ops{display:grid;gap:10px;margin-top:12px}
.op{border:1px solid var(--line);border-radius:14px;padding:14px}
.op .top{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.op .txt{margin:0;white-space:pre-wrap;font-size:14.5px}
.op .ft{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;font-size:12.5px;color:var(--mute)}
.op .lk{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;margin-top:6px;word-break:break-all}
.like{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);background:#fff;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:700;color:var(--sub)}
.like.on{background:var(--pri-soft);border-color:#C5D0FF;color:var(--pri-ink)}
.rep{background:none;border:0;color:var(--mute);font-size:12px;padding:4px}
.blind{color:var(--mute);font-size:13.5px;font-style:italic}
.lock{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:26px 12px}
.lock .ic{width:44px;height:44px;border-radius:14px;background:var(--pri-soft);display:grid;place-items:center}
/* form */
.f{margin-top:18px}
.f>label,.f .lbl{display:block;font-weight:700;font-size:14px;margin-bottom:7px}
.f .opt{font-weight:500;color:var(--mute);font-size:12.5px;margin-left:4px}
.inp,.ta{width:100%;border:1.5px solid var(--line2);border-radius:12px;background:#fff;padding:11px 13px;font-size:15px;outline:0;transition:border .15s}
.inp:focus,.ta:focus{border-color:var(--pri)}
.ta{min-height:96px;resize:vertical;line-height:1.6}
.err{color:var(--bad);font-size:12.5px;margin-top:6px;display:none}
.err.on{display:block}
.choices{display:grid;gap:8px}
.choice{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line2);border-radius:14px;padding:12px 14px;cursor:pointer;font-weight:600;background:#fff}
.choice input{display:none}
.choice .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line2);flex:none;display:grid;place-items:center}
.choice:has(input:checked){border-color:var(--pri);background:var(--pri-soft)}
.choice:has(input:checked) .dot{border-color:var(--pri);background:var(--pri)}
.choice:has(input:checked) .dot:after{content:"";width:7px;height:7px;border-radius:50%;background:#fff}
.radios{display:flex;gap:6px;flex-wrap:wrap}
.radios label{cursor:pointer}
.radios input{display:none}
.radios span{display:inline-block;border:1px solid var(--line2);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600;color:var(--sub);background:#fff}
.radios input:checked+span{background:var(--ink);border-color:var(--ink);color:#fff}
.picker{position:relative}
.plist{border:1px solid var(--line);border-radius:12px;margin-top:6px;max-height:220px;overflow:auto;background:#fff}
.plist button{display:flex;justify-content:space-between;width:100%;text-align:left;border:0;background:#fff;padding:10px 13px;border-bottom:1px solid var(--line);font-size:14px}
.plist button:last-child{border-bottom:0}
.plist button:hover{background:#F6F8FC}
.plist small{color:var(--mute)}
.picked{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1.5px solid var(--pri);background:var(--pri-soft);border-radius:12px;padding:10px 13px}
.picked b{font-weight:700}
.pwrow{display:flex;gap:6px;align-items:center}
.pwrow .inp{flex:1;min-width:0}
.pwrow .btn{flex:none;height:44px}
.botck{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--sub);background:#F4F6FB;border-radius:10px;padding:9px 12px;margin-top:16px}
.optrow{display:flex;gap:6px;margin-bottom:8px}
.optrow .num{width:28px;flex:none;display:grid;place-items:center;font-weight:800;color:var(--mute)}
.x{width:40px;flex:none;border:1px solid var(--line2);background:#fff;border-radius:12px;color:var(--mute);font-size:18px}
.sim{border-radius:14px;background:#FFF8E6;padding:12px 14px;margin-top:10px}
.sim .h{font-size:13px;font-weight:700;color:#B35C00;margin-bottom:6px}
.sim .it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px dashed #F1D9A8;font-size:13.5px}
.sim .it:first-of-type{border-top:0}
.prevnote{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--pri-soft);border-radius:12px;padding:10px 13px;font-size:13.5px;margin-top:10px}
/* sheet */
#sheet{position:fixed;inset:0;z-index:60;display:none}
#sheet.on{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(15,20,35,.45);animation:fade .18s}
.sheet{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:560px;max-height:92vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));animation:up .22s cubic-bezier(.2,.8,.2,1)}
@media (min-width:641px){.sheet{bottom:auto;top:50%;transform:translate(-50%,-50%);border-radius:22px;animation:pop .2s}}
.sheet h2{font-size:19px;font-weight:800;margin-bottom:4px}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:#DDE1EA;margin:-8px auto 14px}
@media (min-width:641px){.sheet .grab{display:none}}
.sheet .foot{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:20px}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translate(-50%,40px);opacity:.4}}
@keyframes pop{from{transform:translate(-50%,-46%);opacity:0}}
.bigcode{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:26px;font-weight:800;letter-spacing:1px;text-align:center;background:var(--pri-soft);color:var(--pri-ink);border-radius:14px;padding:18px 10px;margin:16px 0 8px}
/* toast */
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.22s;z-index:80;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* sample banner, footer, dev */
.banner{margin-top:12px;font-size:12.5px;color:#7A5300;background:#FFF4D6;border-radius:12px;padding:9px 13px}
.demobar{display:none;background:repeating-linear-gradient(-45deg,#FFE7A0 0 14px,#FFF0C4 14px 28px);color:#6B4700;font-size:12.5px;font-weight:700;text-align:center;padding:7px 12px;line-height:1.5}
.demobar a{color:#6B4700;margin-left:8px;white-space:nowrap}
body.demo .demobar{display:block}
body.demo{--bg:#F7F5EE}
.pill.ex{background:#FFE7A0;color:#6B4700}
.pill.feat{background:#F0EBFF;color:#5B3CC4}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.how .st{background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:14px}
.how .no{width:24px;height:24px;border-radius:50%;background:var(--pri-soft);color:var(--pri-ink);display:grid;place-items:center;font-size:12.5px;font-weight:800;margin-bottom:8px}
.how b{display:block;font-size:14px;line-height:1.4;margin-bottom:3px}
.how span{font-size:12.5px;color:var(--sub);line-height:1.5;display:block}
@media (max-width:560px){.how{grid-template-columns:1fr}.how .st{display:grid;grid-template-columns:24px 1fr;column-gap:10px;padding:12px 14px}.how .no{grid-row:span 2;margin:0}}
.exq{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.exq button{border:1px dashed var(--line2);background:#fff;border-radius:12px;padding:8px 12px;font-size:13.5px;color:var(--ink);text-align:left;line-height:1.45}
.exq button:hover{border-color:var(--pri);background:var(--pri-soft)}
.exq small{display:block;font-size:11.5px;color:var(--mute);font-weight:600}
.gate{text-align:center;padding:22px 8px 6px}
.gate .segs{display:flex;gap:6px;justify-content:center;margin:14px 0 12px}
.gate .segs i{width:34px;height:8px;border-radius:4px;background:#E3E7F0}
.gate .segs i.on{background:var(--pri)}
.shlink{display:flex;gap:6px;margin-top:14px}
.shlink .inp{font-size:13px;padding:8px 11px;color:var(--sub)}
.shlink .btn{white-space:nowrap;flex:none;height:auto}
.shc{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px}
.shc pre{margin:8px 0 0;white-space:pre-wrap;word-break:break-all;font-family:inherit;font-size:13px;color:var(--sub);background:#F6F7FA;border-radius:10px;padding:10px 12px;line-height:1.6;max-height:170px;overflow:auto}
.admchip{border:0;background:#5B3CC4;color:#fff;font-weight:700;font-size:13px;border-radius:999px;padding:6px 12px}
.admbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:#F0EBFF;border-radius:14px;padding:10px 12px;margin-top:10px}
.admbar b{color:#5B3CC4;font-size:13px;margin-right:4px}
.btn.danger{color:#C92A2A;border-color:#F3C4C4}
.btn.danger:hover{background:#FFF5F5}
.admrows{display:grid;gap:8px;margin-top:12px}
.admrow{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff}
.admrow .tt{font-weight:700;font-size:14.5px;line-height:1.45;word-break:break-all}
.admrow .meta{font-size:12.5px;color:var(--mute);margin:6px 0 8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.wchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.wchip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line2);background:#fff;border-radius:999px;padding:4px 6px 4px 11px;font-size:13px}
.wchip button{border:0;background:#F1F3F8;border-radius:50%;width:20px;height:20px;line-height:20px;padding:0;color:var(--sub);font-size:13px}
.pill.mine{background:#E7F5FF;color:#1864AB}
.note{background:#F6F7FA;border-radius:12px;padding:10px 12px;margin:0 0 10px;font-size:14px;white-space:pre-wrap;line-height:1.6}
.note b{display:block;font-size:12px;color:var(--pri-ink);margin-bottom:2px}
.jcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:12px;background:#fff;border:1.5px solid #C5D0FF;border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}
.jcard:hover{background:var(--pri-soft)}
.jcard .ic{width:40px;height:40px;border-radius:12px;background:var(--pri-soft);color:var(--pri-ink);display:grid;place-items:center;flex:none}
.jcard .tx{flex:1;min-width:0}
.jcard b{display:block;font-size:15.5px;font-weight:800}
.jcard .tx span{display:block;font-size:12.5px;color:var(--sub);line-height:1.5;margin-top:2px}
.jcard .ar{font-size:24px;color:var(--pri-ink);flex:none}
.jlink{display:block;width:100%;text-align:left;background:var(--pri-soft);border:0;border-radius:12px;padding:10px 14px;margin:12px 0 12px;font-size:13px;color:var(--sub)}
.jlink b{color:var(--pri-ink)}
.jres{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.jres>div{border-radius:14px;padding:12px 14px}
.jres .lead{background:var(--pri-soft);color:var(--pri-ink)}
.jres .help{background:var(--ok-soft);color:#087F5B}
.jres .help.none{background:#F1F3F8;color:var(--sub)}
.jres small{display:block;font-size:12px;font-weight:700;opacity:.8}
.jres b{display:block;font-size:17px;font-weight:800;margin:2px 0;line-height:1.35}
.jres span{display:block;font-size:12px;opacity:.85;line-height:1.45}
.jwarn{background:var(--warn-soft);color:#B35C00;border-radius:10px;padding:8px 12px;margin-top:10px;font-size:13px;font-weight:600}
.jbars{display:grid;gap:7px;margin-top:14px}
.jbar{display:grid;grid-template-columns:132px 1fr 28px;gap:8px;align-items:center;font-size:12.5px}
.jbar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--sub)}
.jbar i{height:10px;border-radius:5px;background:#EEF0F5;overflow:hidden}
.jbar i b{display:block;height:100%;border-radius:5px}
.jbar em{font-style:normal;font-weight:700;text-align:right}
.jrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:10px;align-items:center;border-top:1px solid var(--line);padding:11px 0}
.jrow:first-of-type{border-top:0}
.jrow .jl b{display:block;font-size:14px}
.jrow .jl span{display:block;line-height:1.45;word-break:break-all}
.jrow .jr{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.jrow.book{background:#F6F7FA;border-radius:12px;padding:12px;border-top:0;margin:12px 0 4px}
.jw{font-size:11.5px;color:var(--mute);font-weight:600}
.jchip{display:inline-flex;align-items:center;gap:4px;background:var(--pri-soft);color:var(--pri-ink);border-radius:999px;padding:4px 6px 4px 11px;font-size:13px;font-weight:600}
.jchip button{border:0;background:#fff;border-radius:50%;width:19px;height:19px;line-height:19px;padding:0;color:var(--pri-ink);font-size:12px}
.jadd{height:30px;font-size:12.5px;padding:0 6px}
@media (max-width:560px){.jrow{grid-template-columns:1fr}.jbar{grid-template-columns:104px 1fr 24px}}
.jeyebrow{margin:0 0 4px;font-size:12.5px;font-weight:700;color:var(--pri-ink)}
.jask{display:block;width:100%;text-align:left;margin-top:10px;border:0;border-radius:14px;padding:13px 16px;background:var(--navy);color:#fff;font-family:inherit;cursor:pointer}
.jask b{display:block;font-size:15px}
.jask span{display:block;font-size:12.5px;opacity:.8;margin-top:3px;line-height:1.5}
.jdetail summary{list-style:none;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding-right:28px;position:relative}
.jdetail summary::-webkit-details-marker{display:none}
.jdetail summary:after{content:"";position:absolute;right:4px;top:6px;width:9px;height:9px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg);transition:transform .15s}
.jdetail[open] summary:after{transform:rotate(-135deg);top:10px}
.jdetail[open] summary{margin-bottom:6px}
.jdetail summary b{font-size:16px}
.hlink{display:inline-block;margin-top:14px;background:none;border:0;padding:0;color:#C9D3FA;font-size:13px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.jinfo{border:1px solid var(--line2);background:#fff;color:var(--sub);border-radius:50%;width:18px;height:18px;padding:0;font-size:11px;font-weight:800;line-height:16px;vertical-align:1px}
.principle{margin:0;font-size:16px;font-weight:600;line-height:1.75;border-left:4px solid var(--pri);padding:2px 0 2px 14px}
.principle b{color:var(--pri-ink)}
.nolist{margin:0;padding-left:20px;display:grid;gap:6px;font-size:14.5px}
.critem{border-top:1px solid var(--line);padding:16px 0;scroll-margin-top:90px;border-radius:12px;transition:background .6s}
.critem:first-child{border-top:0;padding-top:4px}
.critem.flash{background:#FFF8E1}
.critem h3{font-size:16px;font-weight:800;display:flex;gap:8px;align-items:center}
.wb{display:inline-flex;gap:3px;align-items:center;background:var(--pri-soft);color:var(--pri-ink);border-radius:999px;font-size:12px;padding:2px 9px;font-weight:800}
.wb i{width:6px;height:6px;border-radius:50%;background:var(--pri)}
.wb i.off{background:#C9D2F5}
.critem p{margin:6px 0 0;font-size:14px;color:var(--sub);line-height:1.65}
.critem p b{color:var(--ink)}
.critem .ex{display:inline-block;margin-top:8px;font-size:13px;background:#F4F6FB;border-radius:8px;padding:5px 10px;color:var(--ink)}
.rules{margin:0;padding-left:20px;display:grid;gap:8px;font-size:14.5px}
.ctable{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:4px}
.ctable th,.ctable td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.ctable th{font-weight:700;white-space:nowrap}
.ctable td.n{text-align:right;white-space:nowrap;color:var(--sub)}
.ctable .jchip{padding:3px 10px;margin:0 4px 4px 0}
.verdict{background:#F4F6FB;border-radius:12px;padding:12px 14px;margin-top:12px;font-size:14px;line-height:1.7}
.adict{display:grid;gap:0}
.adict>div{border-top:1px solid var(--line);padding:11px 0}
.adict>div:first-child{border-top:0}
.adict b{font-size:14.5px}
.adict small{color:var(--mute);margin-left:6px}
.adict .kw{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.adict .kw span{font-size:12px;background:#F1F3F8;color:var(--sub);border-radius:999px;padding:2px 8px}
.ddict summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center}
.ddict summary::-webkit-details-marker{display:none}
.ddict summary:after{content:"펼치기";font-size:12.5px;color:var(--pri-ink);font-weight:600}
.ddict[open] summary:after{content:"접기"}
.ddict[open] summary{margin-bottom:8px}
.logt{width:100%;border-collapse:collapse;font-size:13.5px}
.logt td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.logt td:first-child{font-weight:800;white-space:nowrap;color:var(--pri-ink)}
.logt td:nth-child(2){white-space:nowrap;color:var(--mute)}
.evid{padding:22px 22px 18px}
.evh{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--ink);letter-spacing:.2px;margin:18px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.evh:first-child{margin-top:0}
.evh span{width:20px;height:20px;border-radius:6px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:11.5px}
.evh small{font-weight:500;color:var(--mute);margin-left:auto;font-size:12px}
.evgist{margin:0;font-size:15px;line-height:1.8}
.evgist b{color:var(--ink)}
.evhead{display:grid;grid-template-columns:150px minmax(0,1fr) 170px;gap:12px;font-size:11.5px;font-weight:700;color:var(--mute);padding:0 10px 6px}
.evtable{border-top:1px solid var(--line)}
.evrow{display:grid;grid-template-columns:150px minmax(0,1fr) 170px;gap:12px;align-items:start;padding:10px 10px;border-bottom:1px solid var(--line);border-left:3px solid transparent}
.evrow.lead{border-left-color:var(--pri)}
.evrow.help{border-left-color:#12B886}
.evrow.none{color:var(--mute)}
.evrow.none .evk b{color:var(--mute)}
.evk{display:flex;gap:6px;align-items:baseline;font-size:14px}
.evq{font-size:13.5px;line-height:1.6;color:var(--sub);word-break:keep-all;overflow-wrap:anywhere}
.evq q{quotes:"「" "」"}
.evq mark{background:#FFF0B3;color:var(--ink);font-weight:700;border-radius:3px;padding:0 2px}
.eva{display:flex;flex-wrap:wrap;gap:4px}
.evtag{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;border-radius:8px;padding:3px 8px;background:#F1F3F8;color:var(--sub)}
.evtag em{font-style:normal;font-weight:800;opacity:.75}
.evtag.l{background:var(--pri-soft);color:var(--pri-ink)}
.evtag.h{background:var(--ok-soft);color:#087F5B}
.evsum{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:#F6F7FA;border-radius:12px;padding:12px 16px}
.evscore{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:700;white-space:nowrap}
.evscore b{font-size:24px;font-weight:800;margin-left:4px}
.evscore .l{color:var(--pri-ink)}
.evscore .h{color:#087F5B}
.evscore .vs{color:var(--mute);font-size:18px}
.evsum p{margin:0;font-size:14px;line-height:1.65;flex:1;min-width:220px}
.evfoot{font-size:12px;color:var(--mute);margin:12px 0 0;line-height:1.6}
@media (max-width:640px){
  .evid{padding:18px 16px 16px}
  .evhead{display:none}
  .evrow{grid-template-columns:1fr;gap:5px;padding:10px 10px}
}
.only-narrow{display:none}
@media (max-width:640px){.only-narrow{display:flex}.only-wide{display:none!important}}
.hseg{gap:4px;background:rgba(255,255,255,.12);border-radius:12px;padding:4px;margin:-4px 0 16px}
.hseg button{flex:1;border:0;background:none;color:#C9D3FA;font-weight:700;font-size:13.5px;padding:8px 6px;border-radius:9px}
.hseg button.on{background:#fff;color:var(--navy)}
.critop .hseg{background:var(--navy);margin:14px 0 0}
.critop .back{padding-top:12px}
.cbadge{display:inline-flex;align-items:center;gap:5px;border:1px solid #C5D0FF;background:var(--pri-soft);color:var(--pri-ink);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.sech .sn{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;background:var(--navy);color:#fff;font-size:12.5px;margin-right:8px;vertical-align:2px}
/* ① 세 가지 질문 */
.q3{display:flex;align-items:stretch;gap:8px}
.q3c{flex:1;background:#F4F6FB;border-radius:14px;padding:14px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.q3i{width:46px;height:46px;border-radius:14px;background:var(--navy);color:#fff;display:grid;place-items:center;margin-bottom:4px}
.q3c b{font-size:14.5px;line-height:1.4}
.q3c small{font-size:12px;color:var(--pri-ink);font-weight:700}
.q3a{align-self:center;color:var(--mute);font-size:22px;font-weight:800}
.q3r{margin-top:12px;text-align:center;background:var(--pri-soft);color:var(--pri-ink);border-radius:12px;padding:10px;font-size:14px}
@media (max-width:560px){.q3{flex-direction:column}.q3c{flex-direction:row;text-align:left;gap:12px;padding:10px 12px}.q3i{margin:0;width:40px;height:40px;flex:none}.q3a{transform:rotate(90deg);margin:-6px auto}.q3c small{margin-left:auto}}
/* ② 무게 막대와 단별 카드 */
.wbar{display:flex;gap:3px;height:44px;border-radius:12px;overflow:hidden}
.wbar>div{display:flex;flex-direction:column;justify-content:center;padding:0 10px;color:#fff;min-width:0}
.wbar b{font-size:12.5px;white-space:nowrap}
.wbar span{font-size:11.5px;opacity:.85}
.wbar .t3,.tier.t3 .ti{background:var(--navy)}
.wbar .t2,.tier.t2 .ti{background:var(--pri)}
.wbar .t1{background:#A9B6F5}
.tier.t1 .ti{background:#A9B6F5}
.tier{margin-top:14px}
.tierh{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.tierh b{font-size:14px}
.tierh span{font-size:12.5px;color:var(--mute)}
.tcards{display:grid;gap:8px;grid-template-columns:repeat(3,minmax(0,1fr))}
.tier.t2 .tcards{grid-template-columns:repeat(2,minmax(0,1fr))}
.tier.t1 .tcards{grid-template-columns:repeat(4,minmax(0,1fr))}
.tcard{background:#F6F7FA;border-radius:14px;border:1px solid transparent;transition:background .6s,border-color .2s}
.tcard[open]{background:#fff;border-color:var(--line2);grid-column:1/-1}
.tcard.flash{background:#FFF8E1}
.tcard summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px}
.tcard summary::-webkit-details-marker{display:none}
.ti{width:38px;height:38px;flex:none;border-radius:11px;color:#fff;display:grid;place-items:center}
.tier.t1 .tcard summary{flex-direction:column;align-items:flex-start;gap:6px}
.tier.t1 .ti{width:32px;height:32px;border-radius:9px}
.tt{display:flex;flex-direction:column;min-width:0;flex:1}
.tt b{font-size:14.5px;line-height:1.35}
.tt small{font-size:12px;color:var(--mute);line-height:1.45}
.tw{flex:none;width:8px;height:8px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg);margin:0 4px 4px 0;transition:transform .15s}
.tcard[open] .tw{transform:rotate(-135deg);margin:4px 4px 0 0}
.tier.t1 .tw{position:absolute;right:14px;top:16px}
.tier.t1 .tcard summary{position:relative}
.tbody{padding:0 14px 14px}
.tbody p{margin:6px 0 0;font-size:14px;color:var(--sub);line-height:1.65}
.tbody p b{display:inline-block;color:var(--ink);font-size:12px;background:#F1F3F8;border-radius:6px;padding:1px 7px;margin-right:6px}
.tbody .ex{display:inline-block;margin-top:8px;font-size:13px;background:#FFF8E1;border-radius:8px;padding:5px 10px}
@media (max-width:640px){.tcards,.tier.t2 .tcards{grid-template-columns:1fr}.tier.t1 .tcards{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* ③ 흐름 */
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;counter-reset:f}
.fs{position:relative;background:#F4F6FB;border-radius:14px;padding:14px 12px}
.fs:not(:last-child):after{content:"";position:absolute;right:-8px;top:50%;width:8px;height:2px;background:var(--line2)}
.fs i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800;margin-bottom:6px}
.fs:last-child{background:var(--navy);color:#fff}
.fs:last-child i{background:#fff;color:var(--navy)}
.fs:last-child span{color:#C9D3FA}
.fs b{display:block;font-size:14.5px}
.fs span{display:block;font-size:12.5px;color:var(--sub);line-height:1.5;margin-top:2px}
@media (max-width:640px){.flow{grid-template-columns:1fr 1fr}.fs:nth-child(2):after{display:none}}
.fshort{margin-top:10px;border:1.5px dashed #C5D0FF;border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.6}
.fshort>b:first-child{display:inline-block;background:var(--pri);color:#fff;border-radius:6px;padding:0 7px;font-size:12px;margin-right:6px}
.rulebox{margin-top:10px;background:var(--warn-soft);border-radius:12px;padding:12px 14px;font-size:14px}
.rulebox .rr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.rc{background:#fff;border-radius:10px;padding:6px 12px;font-weight:800;color:#B35C00}
.ro{font-size:12.5px;color:#B35C00;font-weight:700}
/* ④ 쌓인 막대·눈금 */
.sbars{display:grid;gap:10px}
.sbar{display:grid;grid-template-columns:120px minmax(0,1fr) 30px;gap:10px;align-items:center}
.sbl{display:flex;flex-direction:column;gap:2px;font-size:13px}
.sbl span{font-size:11px;font-weight:800;border-radius:6px;padding:0 6px;width:max-content}
.sbl .l{background:var(--pri-soft);color:var(--pri-ink)}

<script>
/* =========================================================
   옆 학교는?
   - CONFIG에 Supabase 주소와 공개 키(anon key)를 넣으면 실서비스 모드로 동작합니다.

   - 같은 폴더의 schools.js(전국 초등학교 목록)를 읽습니다. 서버의 학교 목록은 supabase/schools-*.sql로 넣습니다.
   ========================================================= */
const CONFIG = {
  SUPABASE_URL: 'https://kcgntohyhikhvowkslcf.supabase.co',
  SUPABASE_ANON_KEY: 'sb_publishable_ixXy3ojgNNnY-fkiF-Y-rA_L92VEGly',   // Publishable key (공개되어도 되는 키)
  TURNSTILE_SITE_KEY: ''   // 선택: Cloudflare Turnstile 사이트 키 (Supabase 봇 차단을 켰을 때만)
};
const HAS_CONFIG = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY);
/* 주소에 ?demo가 있으면(또는 키가 없으면) 체험 모드: 예시 데이터만 쓰고 서버에는 아무것도 저장하지 않습니다 */
let DEMO = !HAS_CONFIG || new URLSearchParams(location.search).has('demo');
let LIVE = HAS_CONFIG && !DEMO;
// 채팅·편집기 미리보기처럼 일반 웹 주소가 아닌 곳: 서버 연결이 막히면 체험 모드로 보여 줌
const PREVIEW = (() => { try { return !/^https?:$/.test(location.protocol) || location.origin === 'null' || window.top !== window; } catch (e) { return true; } })();
let PREVIEW_FALLBACK = false;
const withTimeout = (p, ms, code) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error(code || 'TIMEOUT')), ms))]);
const MIN_SCHOOLS = 5;   // 이 수 이상 학교가 모여야 결과(비율·지도·의견)를 공개
let sb = null;

const NOW = new Date();
const CUR_YEAR = (NOW.getMonth() + 1 >= 3) ? NOW.getFullYear() : NOW.getFullYear() - 1; // 학년도: 3월 1일 시작
const COLORS = ['#4C6EF5', '#12B886', '#F59F00', '#F0645A', '#845EF7'];
const CATS = ['업무분장', '늘봄', '학적·출결', '학교폭력', '복무', '회계·계약', '시설·안전', '기타'];
const POSITIONS = ['교장', '교감', '부장교사', '교사', '행정실장', '주무관', '교육공무직'];
const ROLE_LABEL = { origin: '', confirm: '같은 학교 확인', object: '같은 학교 이견', comment: '의견' };

/* ---------- 시도·학교 (샘플) ---------- */
const REGIONS = [
  ['인천', 'E10', 0, 0], ['서울', 'B10', 1, 0], ['경기', 'J10', 2, 0], ['강원', 'K10', 3, 0],
  ['충남', 'N10', 0, 1], ['세종', 'I10', 1, 1], ['충북', 'M10', 2, 1], ['경북', 'R10', 3, 1],
  ['전북', 'P10', 0, 2], ['대전', 'G10', 1, 2], ['대구', 'D10', 2, 2], ['울산', 'H10', 3, 2],
  ['광주', 'F10', 0, 3], ['전남', 'Q10', 1, 3], ['경남', 'S10', 2, 3], ['부산', 'C10', 3, 3],
  ['제주', 'T10', 0, 4]
].map(([n, c, x, y]) => ({ n, c, x, y }));
const STEMS = ['가람', '한빛', '새솔', '다온', '누리', '도담', '별빛', '새봄', '하늬', '미리내', '너울', '온새미', '아름', '푸름'];
const SCHOOLS = [];
REGIONS.forEach((r, ri) => {
  for (let k = 0; k < 4; k++) {
    const level = '초', suf = '초등학교';
    SCHOOLS.push({ code: r.c + String(7010000 + ri * 10 + k), name: r.n + STEMS[(ri * 3 + k) % STEMS.length] + suf, region: r.n, level });
  }
});
let REAL_SCHOOLS = false;
const SMAP = Object.fromEntries(SCHOOLS.map(s => [s.code, s]));
/* 학교 코드: '시도교육청코드 + (시도|시군구|학교명) 해시'. supabase/schools-*.sql과 같은 방식이라 서버와 일치합니다. */
const OFFICE_ORDER = [['서울', 'B10'], ['부산', 'C10'], ['대구', 'D10'], ['인천', 'E10'], ['광주', 'F10'], ['대전', 'G10'], ['울산', 'H10'], ['세종', 'I10'], ['경기', 'J10'], ['강원', 'K10'], ['충북', 'M10'], ['충남', 'N10'], ['전북', 'P10'], ['전남', 'Q10'], ['경북', 'R10'], ['경남', 'S10'], ['제주', 'T10']];
function fnv(s) { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16).padStart(8, '0'); }
function setSchools(list) {
  SCHOOLS.length = 0;
  Object.keys(SMAP).forEach(k => delete SMAP[k]);
  list.forEach(o => { SCHOOLS.push(o); SMAP[o.code] = o; });
  REAL_SCHOOLS = true;
  SCHOOL_STEMS = null;
}
async function loadSchools() {
  // schools.js (전국 초등학교 압축 목록) — 더블클릭으로 열어도 읽힙니다
  try {
    if (!window.SCHOOLS) await loadScript('schools.js', 8000);
    const P = window.SCHOOLS && window.SCHOOLS.p;
    if (Array.isArray(P) && P.length === OFFICE_ORDER.length) {
      const list = [];
      P.forEach((part, i) => {
        const [region, office] = OFFICE_ORDER[i];
        part.split(';').forEach(d => {
          const k = d.indexOf('>'); const addr = d.slice(0, k);
          d.slice(k + 1).split('|').forEach(n => {
            const name = n[0] === '*' ? n.slice(1) : n + '초등학교';
            list.push({ code: office + fnv(`${region}|${addr}|${name}`), name, region, level: '초', addr });
          });
        });
      });
      setSchools(list); return;
    }
  } catch (e) { }
  /* schools.js가 없으면 샘플 학교 목록 사용 */
}

/* ---------- 유틸 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '';
function when(x) { return x && x.ex ? '예시' : ago(x.createdAt != null ? x.createdAt : x.at); }
function ago(t) {
  const d = (Date.now() - t) / 1000;
  if (d < 60) return '방금';
  if (d < 3600) return Math.floor(d / 60) + '분 전';
  if (d < 86400) return Math.floor(d / 3600) + '시간 전';
  if (d < 86400 * 30) return Math.floor(d / 86400) + '일 전';
  const x = new Date(t); return `${x.getFullYear()}.${x.getMonth() + 1}.${x.getDate()}`;
}
function maskPI(t) { // 이름·전화번호 등 개인정보 자동 가림
  return String(t || '')
    .replace(/01[016789][-\s.]?\d{3,4}[-\s.]?\d{4}/g, '***-****-****')
    .replace(/\d{2,3}-\d{3,4}-\d{4}/g, '***-****-****')
    .replace(/[\w.+-]+@[\w-]+\.[\w.]+/g, '(이메일 가림)');
}
const LS = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { } }

function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const ADJ = ['단풍', '하늘', '바다', '솔빛', '노을', '새벽', '봄비', '달빛', '은행', '구름', '이슬', '햇살'];
const NOUN = ['고래', '여우', '참새', '사슴', '수달', '부엉이', '다람쥐', '두루미', '펭귄', '토끼', '거북', '고양이'];
function pwWeak(p) {   // 서버(update-4.sql private.pw_weak)와 같은 규칙
  const t = String(p || '').toLowerCase();
  if (t.length < 4 || t.length > 30) return true;
  if (/^(.)\1*$/.test(t)) return true;
  if ('0123456789012345678901234567890abcdefghijklmnopqrstuvwxyz'.includes(t) || '9876543210987654321098765432109zyxwvutsrqponmlkjihgfedcba'.includes(t)) return true;
  return ['qwer', 'qwerty', 'asdf', 'zxcv', 'password', 'pass', '1q2w3e4r', 'qwer1234', 'abcd1234', 'q1w2e3r4'].includes(t);
}
function demoHash(p) { let h = 2166136261; for (const ch of 'yhg:' + p) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619) >>> 0; } return h.toString(36); }   // 체험 모드 전용
function makeCode() {
  let c; do { c = ADJ[Math.floor(Math.random() * ADJ.length)] + '-' + NOUN[Math.floor(Math.random() * NOUN.length)] + '-' + String(Math.floor(Math.random() * 9000) + 1000); }
  while (S.entries.some(e => e.code === c) || S.agendas.some(a => a.code === c) || S.comments.some(m => m.code === c));
  return c;
}

/* ---------- 데이터 저장소 (실서비스: Supabase로 교체) ---------- */
const KEY = 'yhg_demo_v3';
let S;
function load() {
  const raw = LS.get(KEY);
  if (raw) {
    try {
      S = JSON.parse(raw);
      // 학교 목록이 바뀌어(샘플 ↔ 전국 목록) 저장된 학교를 찾을 수 없으면 샘플 데이터를 새로 만듭니다
      if (S.entries.every(e => SMAP[e.schoolCode])) return;
    } catch (e) { }
  }
  S = seed(); save();
}
function save() { LS.set(KEY, JSON.stringify(S)); }

/* 학교별 판정: 같은 학교 안에서 다수인 선택이 그 학교의 1표, 동수면 보류 */
function computeRows(ag) {
  const g = {};
  S.entries.filter(e => e.agendaId === ag.id).forEach(e => (g[e.schoolCode] = g[e.schoolCode] || []).push(e));
  return Object.entries(g).map(([code, list]) => {
    const tally = {};
    list.forEach(e => tally[e.choice] = (tally[e.choice] || 0) + 1);
    const arr = Object.entries(tally).sort((a, b) => b[1] - a[1]);
    const held = arr.length > 1 && arr[0][1] === arr[1][1];
    const choice = held ? null : +arr[0][0];
    const agree = held ? 0 : arr[0][1];
    const confirmed = !held && (agree >= 2 || list.some(e => e.choice === choice && e.reason));
    return { code, sc: SMAP[code], list, tally, held, choice, agree, confirmed };
  }).filter(r => r.sc);
}
function summarize(ag, rows, f) {
  const rs = rows.filter(r => (!f.region || r.sc.region === f.region) && (!f.level || r.sc.level === f.level));
  const valid = rs.filter(r => !r.held && (!f.confirmed || r.confirmed));
  const counts = ag.options.map((_, i) => valid.filter(r => r.choice === i).length);
  return { counts, total: valid.length, held: rs.filter(r => r.held).length, all: rs.length };
}
function opinionsOf(ag) {
  const arr = [];
  S.entries.filter(e => e.agendaId === ag.id && e.reason).forEach(e => arr.push({ id: e.id, choice: e.choice, text: e.reason, link: e.link, position: e.position, code: e.schoolCode, role: e.role, at: e.createdAt, ex: e.ex, mine: e.deviceId === DEV, edited: e.edited }));

  return arr;
}

/* 비슷한 질문 찾기: 글자 2개 묶음(bigram) 유사도 */
function grams(s) { s = String(s).replace(/[^가-힣a-zA-Z0-9]/g, '').toLowerCase(); const g = new Set(); for (let i = 0; i < s.length - 1; i++) g.add(s.slice(i, i + 2)); return g; }
function sim(a, b) { const A = grams(a), B = grams(b); if (!A.size || !B.size) return 0; let n = 0; A.forEach(x => B.has(x) && n++); return n / (A.size + B.size - n); }

/* ---------- 비속어·욕설·학교 이름 차단 ----------
   화면에서 입력 즉시 안내하고, 서버(supabase/update-2.sql)가 같은 규칙으로 저장 직전에 한 번 더 검사합니다.
   관리자 화면에서 추가한 금지어는 서버에만 적용되므로, 아래 기본 목록에 없는 말은 저장할 때 걸러집니다. */
const BAN_WORDS = ["시발", "씨발", "씨바", "시바", "씨빨", "시빨", "쉬발", "쓰발", "씨팔", "시팔", "씹새", "씹년", "씹할", "씹창", "씹놈", "개새끼", "개새기", "개색기", "개색끼", "개세끼", "개쉐", "개쌔", "새끼", "병신", "븅신", "빙신", "좆", "존나", "존내", "지랄", "엠창", "니애미", "니애비", "느금", "니미럴", "미친놈", "미친년", "미친새", "또라이", "돌아이", "똘아이", "닥쳐", "엿먹", "등신같", "호로새", "호로자식", "후레자식", "호래자식", "창녀", "창년", "쌍놈", "쌍년", "썅", "개놈", "섹스", "18놈", "c8", "tlqkf", "qudtls", "whssk", "fuck", "shit", "bitch", "asshole", "ㅅㅂ", "ㅆㅂ", "ㅂㅅ", "ㅄ", "ㅈㄹ", "ㅅㄲ", "ㅈㄴ", "ㅁㅊ", "ㄷㅊ", "ㅗㅗ"];
const ALLOW_WORDS = ["시발점", "시발역", "시발표", "시발생", "시발송", "시발주", "시발령", "시발급", "시발견", "시발행", "시발전", "시바견", "시바로", "시바뀌", "시바꾸", "시바꿔", "새끼손가락", "새끼발가락", "병신고", "병신청", "병신년"];
const BAN_SORTED = [...BAN_WORDS].sort((a, b) => b.length - a.length || (a < b ? -1 : 1));
function normWords(t, keepDigits) {
  let s = String(t || '').toLowerCase().replace(keepDigits ? /[^가-힣ㄱ-ㅎㅏ-ㅣa-z0-9]+/g : /[^가-힣ㄱ-ㅎㅏ-ㅣa-z]+/g, ' ').trim();
  if (!s) return ' ';
  const out = []; let run = '';
  s.split(/ +/).forEach(tok => {   // 한 글자씩 띄어 쓴 것은 붙여서 검사 ("시 1 발" → "시발")
    if (tok.length === 1) run += tok;
    else { if (run) { out.push(run); run = ''; } out.push(tok); }
  });
  if (run) out.push(run);
  return ' ' + out.join(' ') + ' ';
}
function findBad(t) {
  let a = normWords(t, true), b = normWords(t, false);
  ALLOW_WORDS.forEach(w => { a = a.split(w).join(' '); b = b.split(w).join(' '); });
  return BAN_SORTED.find(w => a.includes(w) || b.includes(w)) || null;
}
let SCHOOL_STEMS = null;
function buildStems() {   // 학교 이름 줄임말 (서버의 v_school_stems와 같은 규칙)
  const ex = new Set();
  SCHOOLS.forEach(s => {
    ex.add(s.region);
    if (s.addr) { ex.add(s.addr); const b = s.addr.replace(/(시|군|구)$/, ''); if (b.length >= 2) ex.add(b); }
  });
  const set = new Set();
  SCHOOLS.forEach(s => {
    if (!s.name.endsWith('초등학교')) return;
    const st = s.name.slice(0, -3);
    [st, st.startsWith(s.region) ? st.slice(s.region.length) : null].forEach(x => {
      if (x && x.length >= 3 && !ex.has(x.slice(0, -1))) set.add(x);
    });
  });
  SCHOOL_STEMS = [...set].sort((a, b) => b.length - a.length || (a < b ? -1 : 1));
}
function findSchool(t) {
  if (!SCHOOL_STEMS) buildStems();
  const n = normWords(t, false);
  return SCHOOL_STEMS.find(st => n.includes(st)) || null;
}
const maskWord = w => w.length <= 1 ? '*' : w[0] + '*'.repeat(w.length - 1);
function contentProblem(t) {
  const b = findBad(t);
  if (b) return `부적절한 표현(${maskWord(b)})이 있어요. 고쳐서 다시 적어 주세요.`;
  const s = findSchool(t);
  if (s) return `학교 이름(${s})은 적지 말아 주세요. 이 서비스는 학교 이름을 공개하지 않아요.`;
  return '';
}
function showProblem(id, msg) { const e = document.getElementById(id); if (!e) return; e.textContent = msg; e.classList.toggle('on', !!msg); }

async function run(btn, fn) {

function loadScript(src, ms = 20000) {   // 막힌 네트워크에서 끝없이 기다리지 않도록 제한 시간을 둠
  return new Promise((res, rej) => {

    const t = setTimeout(() => rej(new Error('SCRIPT_FAIL')), ms);

  });
}

    out = out.concat(data);
    if (data.length < 1000) return out;
    from += 1000;

}

/* 화면은 아래 API만 부릅니다. school: 실제 학교 코드, null이면 이 기기에 연결된 학교 */
const API = {

        if (errKey(e) === 'SCHOOL_EXISTS') { // 거절되면 학교 연결도 취소되므로 연결만 따로 저장

    }

    bindSchool(code);

    const n = S.entries.filter(e => e.agendaId === ag.id && e.schoolCode === code).length;
    if (role === 'origin' && n) { save(); fail('SCHOOL_EXISTS'); }

    const e = { id: 'e' + uid(), agendaId: ag.id, schoolCode: code, deviceId: DEV, choice, role, position, reason: maskPI(reason), link, code: makeCode(), createdAt: Date.now() };

  async editEntry(e, f) {

  },

  async editAgenda(ag, f) {

    if (LIVE) {
      const r = await rpc('claim_agenda_pw', { p_agenda: ag.id, p_pw: pw });

    if (S.entries.some(x => x.agendaId === e.agendaId && x.deviceId === DEV && x !== e)) fail('ALREADY');

  let q = '';
  if (view === 'agenda') { const ag = getAg(id); q = ag && ag.short ? 'q=' + ag.short : 'a=' + encodeURIComponent(id); }

  else if (view === 'admin') q = 'admin';
  else if (view === 'home') q = 'list';
  else if (view === 'criteria') q = 'criteria';
  q = [q, d].filter(Boolean).join('&');

}

function parseLoc() {

let VOTE_IO = null;
function setupStickyVote() {   // 휴대폰: 참여 상자가 화면 위로 지나가면 아래에 참여 버튼을 띄움
  const bar = $('#stickyVote'); if (!bar) return;
  if (VOTE_IO) { VOTE_IO.disconnect(); VOTE_IO = null; }
  bar.classList.remove('on');
  const p = document.getElementById('votePanel');
  if (!p || ST.view !== 'agenda' || !('IntersectionObserver' in window)) return;
  VOTE_IO = new IntersectionObserver(([en]) => bar.classList.toggle('on', !en.isIntersecting && en.boundingClientRect.top < 0));
  VOTE_IO.observe(p);
}

function agendaCard(a) {
  const rows = computeRows(a), sm = summarize(a, rows, { region: null, level: '', confirmed: false });
  const ops = opinionsOf(a).length;
  const shown = myEntry(a) || REVEAL.has(a.id);
  const top = sm.counts.indexOf(Math.max(...sm.counts));
  const lock = IC.lock.replace('22', '14').replace('22', '14');
  const vis = shown && sm.total >= MIN_SCHOOLS ?
    `<div class="stack">${sm.counts.map((c, i) => c ? `<i style="width:${c / sm.total * 100}%;background:${COLORS[i]}"></i>` : '').join('')}</div>
     <div class="small" style="margin-bottom:8px"><b style="color:${COLORS[top]}">${esc(a.options[top])}</b> <span class="muted">${pct(sm.counts[top], sm.total)}%로 가장 많아요</span></div>` :
    peekBar(a, shown ? `${sm.total}/${MIN_SCHOOLS}개교 · ${MIN_SCHOOLS}개교가 모이면 공개돼요` : '우리 학교 판단을 남기면 결과가 보여요', lock);
  const tags = [a.ex ? '<span class="pill ex">예시</span>' : '', a.featured ? '<span class="pill feat">운영자 제안</span>' : '', myEntry(a) ? '<span class="pill ok">참여함</span>' : ''].join('');
  return `<button class="acard" data-act="open" data-id="${a.id}">
    ${tags ? `<div class="row">${tags}</div>` : ''}
    <h3${tags ? '' : ' style="margin-top:0"'}>${esc(a.title)}</h3>
    ${vis}
    <div class="meta"><span>${esc(a.category)}</span><span>${a.year}학년도${a.prevId ? ' · 작년과 비교' : ''}</span><span>${sm.all}개교 참여</span><span>의견 ${ops}</span>${sm.held ? `<span>보류 ${sm.held}</span>` : ''}${a.ex ? '' : `<span>${when(a)}</span>`}</div>
  </button>`;
}
function peekBar(a, text, lock) {   // 결과를 가린 흐린 미리보기 (실제 수치와 무관한 모양만)
  let h = 0; for (const ch of String(a.id)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const n = Math.min(a.options.length, 4), w = []; let left = 100;
  for (let i = 0; i < n; i++) { const v = i === n - 1 ? left : Math.max(8, Math.round(left * (0.35 + ((h >> (i * 5)) & 15) / 40))); w.push(v); left = Math.max(0, left - v); }
  return `<div class="peek" aria-label="${esc(text)}"><div class="stack">${w.map((v, i) => `<i style="width:${v}%;background:${COLORS[i]}"></i>`).join('')}</div><em>${lock}${text}</em></div>`;
}

function tileMap(ag, rows) {
  const fr = rows.filter(r => !r.held && (!F.level || r.sc.level === F.level) && (!F.confirmed || r.confirmed));

    const rr = fr.filter(r => r.sc.region === rg.n);
    const pos = `grid-column:${rg.x + 1};grid-row:${rg.y + 1}`;
    if (rr.length < 3) return `<button class="tile ${F.region === rg.n ? 'sel' : ''}" style="${pos}" data-act="fRegion" data-v="${rg.n}" aria-label="${rg.n} ${rr.length}개교">${rg.n}<small>${rr.length ? rr.length + '개교' : '-'}</small></button>`;
    const c = ag.options.map((_, i) => rr.filter(r => r.choice === i).length);
    const top = c.indexOf(Math.max(...c));
    const op = .55 + .45 * (rr.length / maxN);
    return `<button class="tile has ${F.region === rg.n ? 'sel' : ''}" style="${pos};background:${COLORS[top]};opacity:${op.toFixed(2)}" data-act="fRegion" data-v="${rg.n}" aria-label="${rg.n} ${esc(ag.options[top])} 다수, ${rr.length}개교">${rg.n}<small>${rr.length}개교</small></button>`;
  }).join('');
  return `<section class="card sec">
    <div class="between"><h2 style="font-size:18px;font-weight:800">시도별 다수 의견</h2><span class="small muted">타일을 누르면 그 시도만 봐요</span></div>
    <div class="tiles">${tiles}</div>

  </section>`;
}
function compareBlock(prev, ag) {
  const a = summarize(prev, computeRows(prev), { region: null, level: '', confirmed: false });
  const b = summarize(ag, computeRows(ag), { region: null, level: '', confirmed: false });
  if (a.total < MIN_SCHOOLS || b.total < MIN_SCHOOLS) return '';
  const labels = [...new Set([...ag.options, ...prev.options])];
  return `<section class="card sec">
    <div class="between"><h2 style="font-size:18px;font-weight:800">작년과 비교</h2><span class="small muted">전국 기준</span></div>
    <div class="cmp">${labels.map(l => {
      const pi = prev.options.indexOf(l), ci = ag.options.indexOf(l);
      const pv = pi >= 0 ? pct(a.counts[pi], a.total) : 0, cv = ci >= 0 ? pct(b.counts[ci], b.total) : 0;
      const col = COLORS[ci >= 0 ? ci : pi] || '#999';
      return `<div><div class="o">${esc(l)}</div>
        <div class="ln"><span>${prev.year}</span><div class="tr"><i style="width:${pv}%;background:${col};opacity:.4"></i></div><span>${pv}%</span></div>
        <div class="ln"><span>${ag.year}</span><div class="tr"><i style="width:${cv}%;background:${col}"></i></div><span>${cv}%</span></div></div>`;
    }).join('')}</div>
    <p class="note">${prev.year}학년도 ${a.total}개교 · ${ag.year}학년도 ${b.total}개교</p>
  </section>`;
}
function opinionsBlock(ag, rows, sm) {
  const ops = opinionsOf(ag);
  const maj = sm.total ? sm.counts.indexOf(Math.max(...sm.counts)) : -1;
  const minor = ops.filter(o => o.choice !== null && o.choice !== maj && likeN(o.id) >= 3 && !blinded(o.id))
    .sort((x, y) => likeN(y.id) - likeN(x.id)).slice(0, 1);
  const sorted = [...ops].sort((x, y) => OPSORT === 'like' ? likeN(y.id) - likeN(x.id) || y.at - x.at : y.at - x.at);
  let h = `<section class="card sec">
    <div class="between"><h2 style="font-size:18px;font-weight:800">판단 이유 <span class="muted" style="font-weight:600">${ops.length}</span></h2>
      <div class="row"><button class="chip ${OPSORT === 'like' ? 'on' : ''}" data-act="opsort" data-v="like">공감순</button><button class="chip ${OPSORT === 'new' ? 'on' : ''}" data-act="opsort" data-v="new">최신순</button></div></div>`;
  if (minor.length) {
    const o = minor[0];
    h += `<div class="minor"><div class="k">${IC.bulb} 주목할 소수의견 · '${esc(ag.options[o.choice])}' 선택</div>
      <q>${esc(o.text)}</q>
      <div class="between small muted"><span>${who(o)}</span>${likeBtn(o)}</div></div>`;
  }
  h += `<div class="ops">${sorted.length ? sorted.map(o => opItem(ag, o)).join('') : '<div class="empty small">아직 남겨진 이유가 없어요. 첫 의견을 남겨 주세요.</div>'}</div></section>`;
  return h;
}
function who(o) { const sc = SMAP[o.code]; return `${sc ? sc.region : ''}${o.position ? ' · ' + esc(o.position) : ' · 직위 미공개'}`; }
function likeBtn(o) { const on = (S.likes[o.id] || []).includes(DEV); return `<button class="like ${on ? 'on' : ''}" data-act="like" data-id="${o.id}" aria-pressed="${on}">${IC.thumb} 논리적이에요 ${likeN(o.id)}</button>`; }
function opItem(ag, o) {
  const admDel = IS_ADMIN ? `<button class="rep" style="color:#C92A2A" data-act="admDelItem" data-id="${o.id}">삭제</button>` : '';
  if (blinded(o.id)) return `<div class="op"><p class="blind">신고가 누적되어 가려진 의견이에요.</p>${admDel ? `<div class="ft"><span></span>${admDel}</div>` : ''}</div>`;
  const badge = o.choice === null ? `<span class="pill">의견</span>` : `<span class="pill" style="background:${COLORS[o.choice]}1F;color:${COLORS[o.choice]}">${esc(ag.options[o.choice])}</span>`;

    <p class="txt">${esc(o.text)}</p>

  </div>`;

    if (res) res.scrollIntoView({ behavior: 'smooth', block: 'start' });
    return;
  }
  JDG.parsed = parseDoc(JDG.text);
  JDG.crit = buildCriteria(JDG.parsed);
  render();
  const res = document.querySelector('.jres') || document.querySelector('#app .card.sec');
  if (res) res.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function submitVote(btn) {
  const ag = voteSheet._ag, edit = voteSheet._edit;
  const ms = mySchool();
  const chEl = document.querySelector('input[name="vChoice"]:checked');
  const { reason, link, pos, linkBad } = readReason();
  const prob = contentProblem(reason); showProblem('eBad', prob); if (prob) return;
  const useBound = !!(ms && !PICK._changing);
  const hasSchool = edit || useBound || PICK.vote;
  showErr('eSchool', !hasSchool); showErr('eChoice', !chEl); showErr('eLink', linkBad);
  if (!hasSchool || !chEl || linkBad) return;
  const choice = +chEl.value;
  if (edit) return run(btn, async () => { await API.editEntry(edit, { choice, position: pos, reason, link }); closeSheet(); render(); toast('바꿨어요'); });
  run(btn, async () => {
    try {
      const e = await API.castVote(ag, { school: useBound ? null : PICK.vote, choice, role: 'origin', position: pos, reason, link });
      delete PICK._changing; delete PICK.vote;
      doneSheet(e);
    } catch (err) {
      if (errKey(err) !== 'SCHOOL_EXISTS') throw err;
      delete PICK._changing; delete PICK.vote;
      closeSheet(); render(); toast(ERR.SCHOOL_EXISTS);
    }
  });
}

function myCodeItems() {
  const it = [];

  S.entries.filter(e => e.deviceId === DEV && e.code).forEach(e => it.push(itemOfEntry(e)));

function codeText(items) {
  items = items.filter(x => x && x.code);
  const one = items.length === 1;
  const line = (x, i) => one
    ? `○ 질문: ${x.title}\n○ ${x.extra ? x.extra + ' · ' : ''}${x.kind}: ${x.code}`
    : `${i + 1}. ${x.title}\n   └ ${x.extra ? x.extra + ' · ' : ''}${x.kind}: ${x.code}`;
  return `[옆 학교는?] 내 관리 코드${one ? '' : ` ${items.length}개`}\n\n${items.map(line).join('\n')}\n\n다른 기기에서 아래 주소를 열고 「관리 코드로 내 글 불러오기」에 코드를 넣으면 내 글을 다시 고칠 수 있어요.\n${myPageUrl()}`;

    <p class="small muted" style="margin:14px 0 0">같은 학교 흐름 시험: ① 투표 → ② 새 기기로 전환 → ③ 같은 학교로 투표하거나 질문 화면에서 확인·이의신청</p>
    <div class="foot" style="grid-template-columns:1fr"><button class="btn" data-act="closeSheet">닫기</button></div>`),
  newDevice: t => run(t, async () => {

    else { DEV = 'dev-' + uid(); LS.set('yhg_dev', DEV); }

  resetData: () => { LS.del(KEY); load(); REVEAL.clear(); closeSheet(); go('judge'); toast('샘플 데이터로 초기화했어요'); },

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  if (t.tagName === 'A') return;
  e.preventDefault();
  const fn = ACT[t.dataset.act]; if (fn) fn(t, e);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'jText') {
    JDG.text = t.value; showErr('eJ', false);
    clearTimeout(JDG._ft); JDG._ft = setTimeout(() => { const f = $('#jFound'); if (f) f.innerHTML = foundHtml(JDG.text); }, 250);
    return;
  }
  if (/^js(Title|Dept|Target|Content)$/.test(t.id)) { JDG.simple[t.id.slice(2).toLowerCase()] = t.value; if (t.id === 'jsTitle') showErr('eJs', false); return; }
  if (t.id === 'q') { H.q = t.value; renderHomeList(); return; }
  if (t.dataset.schoolSearch) {
    const key = t.dataset.schoolSearch;
    const toks = t.value.trim().split(/\s+/).filter(Boolean).map(w => w.replace(/초$/, '초등').replace(/중$/, '중학').replace(/고$/, '고등'));
    const box = document.getElementById('plist-' + key);
    if (!toks.length) { box.style.display = 'none'; return; }
    const hits = [];
    for (const s of SCHOOLS) {
      const hay = s.region + ' ' + (s.addr || '') + ' ' + s.name;
      if (toks.every(w => hay.includes(w))) { hits.push(s); if (hits.length >= 40) break; }
    }
    box.style.display = 'block';
    box.innerHTML = hits.length ? hits.map(s => `<button data-act="pickSchool" data-for="${key}" data-code="${s.code}"><span>${esc(s.name)}</span><small>${esc(s.region)}${s.addr ? ' ' + esc(s.addr) : ''}</small></button>`).join('') : `<div class="small muted" style="padding:10px 13px">검색 결과가 없어요</div>`;
    return;
  }
  if (t.dataset.new === 'pw') { NEWF.pw = t.value; showErr('ePw', false); return; }
  if (t.dataset.new === 'title') { NEWF.title = t.value; renderSim(); showErr('eTitle', false); }
  else if (t.dataset.new === 'desc') NEWF.desc = t.value;
  else if (t.dataset.newOpt !== undefined) { NEWF.options[+t.dataset.newOpt] = t.value; showErr('eOpt', false); }
  if (t.name === 'vChoice') showErr('eChoice', false);
  liveCheck();
});
function liveCheck() {   // 입력하는 동안 욕설·학교 이름을 바로 안내
  if ($('#nTitle')) showProblem('eBadNew', contentProblem([NEWF.title, NEWF.desc, ...NEWF.options].join(' ')));
  if ($('#vReason')) showProblem('eBad', contentProblem($('#vReason').value));
  if ($('#cText')) showProblem('eBad', contentProblem($('#cText').value));
  if ($('#ecText')) showProblem('eBad', contentProblem($('#ecText').value));
  if ($('#noteIn')) showProblem('eBad', contentProblem($('#noteIn').value));
  if ($('#eaTitle')) showProblem('eBad', contentProblem([$('#eaTitle').value, $('#eaDesc').value, ...[...document.querySelectorAll('[data-ea-opt]')].map(i => i.value)].join(' ')));
}
document.addEventListener('change', e => {
  const t = e.target;
  if (t.classList && t.classList.contains('jadd') && t.value) { const c = JDG.crit[t.dataset.k]; c.areas = [...(c.areas || []), t.value]; render(); return; }
  if (t.id === 'jBook') { JDG.book = t.value; render(); return; }
  if (t.id === 'jFile' || t.id === 'jCam') { if (t.files && t.files.length) readJudgeFiles(t.files); return; }
  if (t.id === 'yearSel') { H.year = t.value; renderHomeList(); }
  else if (t.id === 'sortSel') { H.sort = t.value; renderHomeList(); }
  else if (t.id === 'fConf') { F.confirmed = t.checked; render(); }
  else if (t.dataset.new === 'cat') { NEWF.cat = t.value; showErr('eCat', false); }
  else if (t.name === 'vChoice') showErr('eChoice', false);
});
document.addEventListener('toggle', e => { if (e.target.classList && e.target.classList.contains('jdetail')) JDG.open = e.target.open; }, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#sheet').classList.contains('on')) closeSheet(); });
/* 공문 판별기: 캡처 붙여 넣기(Ctrl+V)와 끌어다 놓기 */
document.addEventListener('paste', e => {
  if (ST.view !== 'judge' || $('#sheet').classList.contains('on')) return;
  const files = [...((e.clipboardData && e.clipboardData.items) || [])].filter(i => i.kind === 'file').map(i => i.getAsFile()).filter(Boolean);
  if (!files.length) return;
  const txt = e.clipboardData.getData('text/plain') || '';
  if (txt.replace(/\s/g, '').length >= 20) {   // 한글·워드에서 복사하면 글자와 그림이 함께 오므로 글자를 우선
    if (/^(TEXTAREA|INPUT)$/.test((e.target && e.target.tagName) || '')) return;
    e.preventDefault(); if (JDG.mode !== 'doc') { JDG.mode = 'doc'; render(); }
    JDG.text = txt; JDG.src = null; JDG.crit = null; render(); return;
  }
  e.preventDefault(); readJudgeFiles(files);
});
const hasFiles = e => e.dataTransfer && [...(e.dataTransfer.types || [])].includes('Files');
document.addEventListener('dragover', e => {
  if (ST.view !== 'judge' || !hasFiles(e)) return;
  e.preventDefault(); e.dataTransfer.dropEffect = 'copy';
  const d = $('#jDrop'); if (d) d.classList.add('drag');
  clearTimeout(JDG._dt); JDG._dt = setTimeout(() => { const d = $('#jDrop'); if (d) d.classList.remove('drag'); }, 180);
});
document.addEventListener('drop', e => {
  if (ST.view !== 'judge' || !hasFiles(e)) return;
  e.preventDefault();
  const d = $('#jDrop'); if (d) d.classList.remove('drag');
  readJudgeFiles(e.dataTransfer.files);
});
window.addEventListener('scroll', () => $('#hdr').classList.toggle('scrolled', scrollY > 4), { passive: true });
function copyText(t, msg) {
  const ok = () => toast(msg);
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(ok).catch(fallback); else fallback();
  function fallback() { const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); ok(); } catch (_) { toast('복사하지 못했어요. 직접 적어 두세요'); } ta.remove(); }
}

/* ---------- 시작 ---------- */
(async () => {
  const demoBar = () => {
    document.body.classList.add('demo');
    $('#demobar').innerHTML = PREVIEW_FALLBACK ? '미리보기 · 서버에 연결할 수 없어 예시 데이터로 보여 줘요. 공문 판별은 그대로 쓸 수 있어요.'
      : `체험 모드 · 여기 보이는 질문과 숫자는 모두 예시예요${HAS_CONFIG ? `<a href="${location.pathname}">실제 서비스로 가기 →</a>` : ''}`;
  };
  if (DEMO) demoBar();
  const DEVMODE = !LIVE || new URLSearchParams(location.search).has('dev');
  if (!DEVMODE) document.querySelector('.devbtn').style.display = 'none';
  $('#app').innerHTML = '<div class="empty sec">불러오는 중…</div>';
  await loadSchools();
  if (LIVE) {
    try { await withTimeout(initLive(), PREVIEW ? 8000 : 20000, 'CONNECT_TIMEOUT'); }
    catch (e) {
      console.error(e);
      if (PREVIEW) {   // 미리보기 창은 외부 서버 연결을 막는 경우가 많음 → 체험 모드로 전환
        PREVIEW_FALLBACK = true; DEMO = true; LIVE = false; sb = null; IS_ADMIN = false;
        demoBar(); load();
        const s = parseLoc(); ST.view = s.view; ST.id = s.id; render();
        return;
      }
      $('#app').innerHTML = '<div class="card empty sec"><b>서버에 연결하지 못했어요</b><p class="small" style="margin:6px 0 14px">잠시 후 새로고침해 주세요.</p><button class="btn sm" onclick="location.reload()">새로고침</button></div>';
      return;
    }
    // 다른 탭이나 앱을 보다 돌아오면 최신 결과로 새로 고침
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && !$('#sheet').classList.contains('on') && ST.view !== 'new') refreshAll().then(render).catch(() => { });
    });
  } else load();
  const s = parseLoc(); ST.view = s.view; ST.id = s.id;
  try { history.replaceState(s, ''); } catch (e) { }
  render();
})();
</script>
