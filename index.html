<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>옆 학교는? · 학교별 1표로 쌓이는 판단 기록</title>
<meta name="description" content="업무 갈등과 공문 핑퐁, 다른 학교는 어떻게 판단했는지 학교별 1표로 모으고 누적하는 서비스">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#F4F6FB;--card:#fff;--ink:#1A1F2C;--sub:#596277;--mute:#9AA2B2;--line:#E6E9F1;--line2:#D5DAE6;
  --pri:#4C6EF5;--pri-ink:#2C46B8;--pri-soft:#EEF2FF;
  --ok:#0CA678;--ok-soft:#E6F7F0;--warn:#E67700;--warn-soft:#FFF4E0;--bad:#E03131;--bad-soft:#FFEDED;
  --r:18px;--shadow:0 1px 2px rgba(20,30,60,.04),0 4px 16px rgba(20,30,60,.05);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.6;word-break:keep-all;padding-bottom:40px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--pri-ink)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
/* header */
header{position:sticky;top:0;z-index:30;background:rgba(244,246,251,.86);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid transparent}
header.scrolled{border-bottom-color:var(--line)}
.hd{display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;font-weight:800;font-size:19px;letter-spacing:-.4px}
.logo .lt{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2;text-align:left}
.logo .lt b{font-size:18px;font-weight:800;letter-spacing:-.4px}
.logo .lt small{font-size:11.5px;font-weight:600;color:var(--mute);letter-spacing:-.2px;margin-top:1px}
@media (max-width:330px){.logo .lt small{display:none}}
.logo .mk{width:30px;height:30px;border-radius:9px;background:var(--pri);display:grid;place-items:center}
.nav{display:flex;gap:4px}
.nav button{background:none;border:0;padding:8px 12px;border-radius:10px;color:var(--sub);font-weight:600;font-size:14px}
.nav button.on{color:var(--ink);background:#fff;box-shadow:var(--shadow)}
.nav button.cta{background:var(--ink);color:#fff}
/* bottom nav (mobile) */
.bnav{display:none}
@media (max-width:640px){
  .nav{display:none}
  body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
  .bnav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--mute);font-weight:600;padding:4px 0}
  .bnav button.on{color:var(--ink)}
  .bnav .plus{width:42px;height:30px;border-radius:12px;background:var(--ink);color:#fff;display:grid;place-items:center}
}
/* common */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.sec{margin-top:16px}
h1,h2,h3{letter-spacing:-.5px;margin:0}
.sub{color:var(--sub)}
.muted{color:var(--mute)}
.small{font-size:13px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:#F0F2F7;color:var(--sub);white-space:nowrap}
.pill.pri{background:var(--pri-soft);color:var(--pri-ink)}
.pill.ok{background:var(--ok-soft);color:#087F5B}
.pill.warn{background:var(--warn-soft);color:#B35C00}
.pill.bad{background:var(--bad-soft);color:#B42424}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line2);background:#fff;font-weight:700;font-size:14.5px;transition:transform .08s,background .15s}
.btn:active{transform:scale(.98)}
.btn:hover{background:#F8F9FC}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:#3F5FE0}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.dark:hover{background:#2B3242}
.btn.block{width:100%}
.btn.sm{height:36px;padding:0 12px;font-size:13.5px;border-radius:10px}
.link{background:none;border:0;padding:0;color:var(--pri-ink);font-weight:600;font-size:13.5px;text-decoration:underline;text-underline-offset:3px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:8px}
/* hero */
.hero{margin-top:12px;background:#1F2A5A;color:#fff;border-radius:22px;padding:26px 22px 22px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:#4C6EF5;opacity:.45}
.hero:before{content:"";position:absolute;right:60px;bottom:-90px;width:160px;height:160px;border-radius:50%;background:#12B886;opacity:.28}
.hero>*{position:relative;z-index:1}
.hero .eyebrow{font-size:12.5px;font-weight:700;color:#B7C4FF;margin:0 0 8px}
.hero h1{font-size:27px;line-height:1.3;font-weight:800}
.hero p{color:#D3DAF5;margin:10px 0 0;font-size:14.5px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.stat{background:rgba(255,255,255,.1);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-size:21px;font-weight:800}
.stat span{font-size:12px;color:#C4CDEE}
/* search */
.search{display:flex;align-items:center;gap:8px;background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:0 14px;height:50px;border:1.5px solid transparent}
.search:focus-within{border-color:var(--pri)}
.search input{flex:1;border:0;outline:0;background:none;font-size:15px;min-width:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line2);background:#fff;border-radius:999px;padding:6px 13px;font-size:13.5px;font-weight:600;color:var(--sub)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tools{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:8px 0 10px}
.sel{height:34px;border:1px solid var(--line2);border-radius:10px;background:#fff;padding:0 10px;font-size:13px;font-weight:600;color:var(--sub)}
/* agenda cards */
.alist{display:grid;gap:10px}
.acard{display:block;width:100%;text-align:left;background:#fff;border:0;border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;transition:transform .12s}
.acard:hover{transform:translateY(-1px)}
.acard h3{font-size:16.5px;font-weight:700;line-height:1.45;margin:8px 0 10px}
.acard .meta{font-size:12.5px;color:var(--mute);display:flex;gap:10px;flex-wrap:wrap}
.stack{display:flex;height:8px;border-radius:5px;overflow:hidden;background:#EEF0F5;margin-bottom:8px}
.stack i{display:block;height:100%}
.hidden-res{font-size:12.5px;color:var(--sub);background:#F4F6FB;border-radius:10px;padding:7px 10px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.empty{text-align:center;padding:36px 16px;color:var(--sub)}
.sech{display:flex;align-items:baseline;justify-content:space-between;margin:26px 2px 10px}
.sech h2{font-size:17px;font-weight:800}
.prog{display:flex;gap:4px;margin-top:2px}
.prog i{width:22px;height:6px;border-radius:3px;background:#E3E7F0}
.prog i.on{background:var(--ok)}
/* agenda detail */
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--sub);font-weight:600;padding:12px 0 4px;font-size:14px}
.ahead h1{font-size:23px;line-height:1.4;font-weight:800;margin:10px 0 8px}
.ahead .desc{color:var(--sub);margin:0 0 12px;white-space:pre-wrap}
.panel{border-radius:16px;padding:16px;background:var(--pri-soft);margin-top:14px}
.panel.warn{background:var(--warn-soft)}
.panel.mine{background:var(--ok-soft)}
.panel .t{font-weight:700;font-size:15.5px;margin:0 0 4px}
.panel p{margin:0 0 12px;font-size:13.5px;color:var(--sub)}
.panel .acts{display:grid;gap:8px}
@media (min-width:560px){.panel .acts.three{grid-template-columns:1fr 1fr 1fr}}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700;background:#fff;border-radius:8px;padding:2px 8px;font-size:13px;white-space:nowrap}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--sub);cursor:pointer;user-select:none}
.toggle input{display:none}
.toggle .sw{width:36px;height:21px;border-radius:999px;background:#D5DAE6;position:relative;transition:.15s}
.toggle .sw:after{content:"";position:absolute;left:3px;top:3px;width:15px;height:15px;border-radius:50%;background:#fff;transition:.15s}
.toggle input:checked+.sw{background:var(--ok)}
.toggle input:checked+.sw:after{left:18px}
.bars{display:grid;gap:14px;margin-top:16px}
.bar .lab{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:6px}
.bar .lab b{font-weight:800}
.bar .lab .n{color:var(--mute);font-size:12.5px;font-weight:500;margin-left:4px}
.bar .tr{height:14px;border-radius:7px;background:#EEF0F5;overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:7px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar.top .lab span:first-child{font-weight:700}
.note{font-size:12.5px;color:var(--mute);margin-top:12px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px;max-width:420px}
.tile{aspect-ratio:1.35/1;border-radius:12px;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:#EEF0F5;color:var(--mute);padding:0}
.tile small{font-size:11px;font-weight:600;opacity:.85}
.tile.has{color:#fff}
.tile.sel{outline:3px solid var(--ink);outline-offset:1px}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:var(--sub)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.cmp{display:grid;gap:12px;margin-top:12px}
.cmp .o{font-size:13.5px;font-weight:600;margin-bottom:4px}
.cmp .ln{display:grid;grid-template-columns:62px 1fr 40px;align-items:center;gap:8px;font-size:12px;color:var(--mute);margin-top:3px}
.cmp .ln .tr{height:8px;border-radius:4px;background:#EEF0F5;overflow:hidden}
.cmp .ln .tr i{display:block;height:100%;border-radius:4px}
.minor{border-radius:16px;background:#FFF8E6;padding:16px;margin-top:16px}
.minor .k{font-size:12.5px;font-weight:700;color:#B35C00;display:flex;align-items:center;gap:6px;margin-bottom:6px}
.minor q{display:block;font-size:15px;line-height:1.65;quotes:none;margin-bottom:8px}
.ops{display:grid;gap:10px;margin-top:12px}
.op{border:1px solid var(--line);border-radius:14px;padding:14px}
.op .top{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.op .txt{margin:0;white-space:pre-wrap;font-size:14.5px}
.op .ft{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;font-size:12.5px;color:var(--mute)}
.op .lk{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;margin-top:6px;word-break:break-all}
.like{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);background:#fff;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:700;color:var(--sub)}
.like.on{background:var(--pri-soft);border-color:#C5D0FF;color:var(--pri-ink)}
.rep{background:none;border:0;color:var(--mute);font-size:12px;padding:4px}
.blind{color:var(--mute);font-size:13.5px;font-style:italic}
.lock{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:26px 12px}
.lock .ic{width:44px;height:44px;border-radius:14px;background:var(--pri-soft);display:grid;place-items:center}
/* form */
.f{margin-top:18px}
.f>label,.f .lbl{display:block;font-weight:700;font-size:14px;margin-bottom:7px}
.f .opt{font-weight:500;color:var(--mute);font-size:12.5px;margin-left:4px}
.inp,.ta{width:100%;border:1.5px solid var(--line2);border-radius:12px;background:#fff;padding:11px 13px;font-size:15px;outline:0;transition:border .15s}
.inp:focus,.ta:focus{border-color:var(--pri)}
.ta{min-height:96px;resize:vertical;line-height:1.6}
.err{color:var(--bad);font-size:12.5px;margin-top:6px;display:none}
.err.on{display:block}
.choices{display:grid;gap:8px}
.choice{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line2);border-radius:14px;padding:12px 14px;cursor:pointer;font-weight:600;background:#fff}
.choice input{display:none}
.choice .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line2);flex:none;display:grid;place-items:center}
.choice:has(input:checked){border-color:var(--pri);background:var(--pri-soft)}
.choice:has(input:checked) .dot{border-color:var(--pri);background:var(--pri)}
.choice:has(input:checked) .dot:after{content:"";width:7px;height:7px;border-radius:50%;background:#fff}
.radios{display:flex;gap:6px;flex-wrap:wrap}
.radios label{cursor:pointer}
.radios input{display:none}
.radios span{display:inline-block;border:1px solid var(--line2);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600;color:var(--sub);background:#fff}
.radios input:checked+span{background:var(--ink);border-color:var(--ink);color:#fff}
.picker{position:relative}
.plist{border:1px solid var(--line);border-radius:12px;margin-top:6px;max-height:220px;overflow:auto;background:#fff}
.plist button{display:flex;justify-content:space-between;width:100%;text-align:left;border:0;background:#fff;padding:10px 13px;border-bottom:1px solid var(--line);font-size:14px}
.plist button:last-child{border-bottom:0}
.plist button:hover{background:#F6F8FC}
.plist small{color:var(--mute)}
.picked{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1.5px solid var(--pri);background:var(--pri-soft);border-radius:12px;padding:10px 13px}
.picked b{font-weight:700}
.botck{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--sub);background:#F4F6FB;border-radius:10px;padding:9px 12px;margin-top:16px}
.optrow{display:flex;gap:6px;margin-bottom:8px}
.optrow .num{width:28px;flex:none;display:grid;place-items:center;font-weight:800;color:var(--mute)}
.x{width:40px;flex:none;border:1px solid var(--line2);background:#fff;border-radius:12px;color:var(--mute);font-size:18px}
.sim{border-radius:14px;background:#FFF8E6;padding:12px 14px;margin-top:10px}
.sim .h{font-size:13px;font-weight:700;color:#B35C00;margin-bottom:6px}
.sim .it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px dashed #F1D9A8;font-size:13.5px}
.sim .it:first-of-type{border-top:0}
.prevnote{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--pri-soft);border-radius:12px;padding:10px 13px;font-size:13.5px;margin-top:10px}
/* sheet */
#sheet{position:fixed;inset:0;z-index:60;display:none}
#sheet.on{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(15,20,35,.45);animation:fade .18s}
.sheet{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:560px;max-height:92vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));animation:up .22s cubic-bezier(.2,.8,.2,1)}
@media (min-width:641px){.sheet{bottom:auto;top:50%;transform:translate(-50%,-50%);border-radius:22px;animation:pop .2s}}
.sheet h2{font-size:19px;font-weight:800;margin-bottom:4px}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:#DDE1EA;margin:-8px auto 14px}
@media (min-width:641px){.sheet .grab{display:none}}
.sheet .foot{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:20px}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translate(-50%,40px);opacity:.4}}
@keyframes pop{from{transform:translate(-50%,-46%);opacity:0}}
.bigcode{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:26px;font-weight:800;letter-spacing:1px;text-align:center;background:var(--pri-soft);color:var(--pri-ink);border-radius:14px;padding:18px 10px;margin:16px 0 8px}
/* toast */
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.22s;z-index:80;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* sample banner, footer, dev */
.banner{margin-top:12px;font-size:12.5px;color:#7A5300;background:#FFF4D6;border-radius:12px;padding:9px 13px}
.demobar{display:none;background:repeating-linear-gradient(-45deg,#FFE7A0 0 14px,#FFF0C4 14px 28px);color:#6B4700;font-size:12.5px;font-weight:700;text-align:center;padding:7px 12px;line-height:1.5}
.demobar a{color:#6B4700;margin-left:8px;white-space:nowrap}
body.demo .demobar{display:block}
body.demo{--bg:#F7F5EE}
.pill.ex{background:#FFE7A0;color:#6B4700}
.pill.feat{background:#F0EBFF;color:#5B3CC4}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.how .st{background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:14px}
.how .no{width:24px;height:24px;border-radius:50%;background:var(--pri-soft);color:var(--pri-ink);display:grid;place-items:center;font-size:12.5px;font-weight:800;margin-bottom:8px}
.how b{display:block;font-size:14px;line-height:1.4;margin-bottom:3px}
.how span{font-size:12.5px;color:var(--sub);line-height:1.5;display:block}
@media (max-width:560px){.how{grid-template-columns:1fr}.how .st{display:grid;grid-template-columns:24px 1fr;column-gap:10px;padding:12px 14px}.how .no{grid-row:span 2;margin:0}}
.exq{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.exq button{border:1px dashed var(--line2);background:#fff;border-radius:12px;padding:8px 12px;font-size:13.5px;color:var(--ink);text-align:left;line-height:1.45}
.exq button:hover{border-color:var(--pri);background:var(--pri-soft)}
.exq small{display:block;font-size:11.5px;color:var(--mute);font-weight:600}
.gate{text-align:center;padding:22px 8px 6px}
.gate .segs{display:flex;gap:6px;justify-content:center;margin:14px 0 12px}
.gate .segs i{width:34px;height:8px;border-radius:4px;background:#E3E7F0}
.gate .segs i.on{background:var(--pri)}
.shlink{display:flex;gap:6px;margin-top:14px}
.shlink .inp{font-size:13px;padding:8px 11px;color:var(--sub)}
.shlink .btn{white-space:nowrap;flex:none;height:auto}
.shc{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px}
.shc pre{margin:8px 0 0;white-space:pre-wrap;word-break:break-all;font-family:inherit;font-size:13px;color:var(--sub);background:#F6F7FA;border-radius:10px;padding:10px 12px;line-height:1.6;max-height:170px;overflow:auto}
.admchip{border:0;background:#5B3CC4;color:#fff;font-weight:700;font-size:13px;border-radius:999px;padding:6px 12px}
.admbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:#F0EBFF;border-radius:14px;padding:10px 12px;margin-top:10px}
.admbar b{color:#5B3CC4;font-size:13px;margin-right:4px}
.btn.danger{color:#C92A2A;border-color:#F3C4C4}
.btn.danger:hover{background:#FFF5F5}
.admrows{display:grid;gap:8px;margin-top:12px}
.admrow{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff}

  D.entries = ens.map(e => ({ id: e.id, agendaId: e.agenda_id, schoolCode: e.school_key, deviceId: e.mine ? DEV : 'o', choice: e.choice, role: e.role, position: e.position, reason: e.reason, link: e.link, code: codes[e.id] || '', createdAt: Date.parse(e.created_at), edited: !!e.edited_at }));
  D.comments = cms.map(c => ({ id: c.id, agendaId: c.agenda_id, schoolCode: c.school_key, deviceId: c.mine ? DEV : 'o', text: c.body, position: c.position, createdAt: Date.parse(c.created_at), edited: !!c.edited_at, code: cCodes[c.id] || '' }));
  lks.forEach(l => D.likes[l.target_id] = fillN(l.n, l.mine, DEV));
  rps.forEach(r => D.reports[r.target_id] = fillN(r.n, r.mine, DEV));
  S = D;
}
const fail = k => { throw new Error(k); };
function localShort() {   // 체험 모드용 6자리 코드 (실서비스는 서버가 만듦)
  const abc = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let c;
  do { c = Array.from({ length: 6 }, () => abc[Math.floor(Math.random() * abc.length)]).join(''); } while (S.agendas.some(a => a.short === c));
  return c;
}

/* 화면은 아래 API만 부릅니다. school: 실제 학교 코드, null이면 이 기기에 연결된 학교 */
const API = {
  async castVote(ag, { school, choice, role, position, reason, link }) {
    if (LIVE) {
      try {
        const r = await rpc('cast_vote', { p_agenda: ag.id, p_school: school, p_choice: choice, p_role: role, p_position: position, p_reason: reason, p_link: link });
        await refreshAll();
        return S.entries.find(e => e.id === r.id) || { code: r.code };
      } catch (e) {
        if (errKey(e) === 'SCHOOL_EXISTS') { // 거절되면 학교 연결도 취소되므로 연결만 따로 저장
          if (school) await rpc('change_school', { p_school: school }).catch(() => { });
          await refreshAll();
        }
        throw e;
      }
    }
    const ms = mySchool(), cur = S.deviceSchool[DEV];
    const code = school || (ms && ms.code);
    if (!code) fail('NO_SCHOOL');
    if (cur && cur.year === CUR_YEAR && cur.code !== code && (cur.changes || 0) >= 1) fail('SCHOOL_LOCKED');
    bindSchool(code);
    if (S.entries.some(e => e.agendaId === ag.id && e.deviceId === DEV)) fail('ALREADY');
    const n = S.entries.filter(e => e.agendaId === ag.id && e.schoolCode === code).length;
    if (role === 'origin' && n) { save(); fail('SCHOOL_EXISTS'); }
    if (role !== 'origin' && !n) fail('NO_SCHOOL_VOTE');
    const e = { id: 'e' + uid(), agendaId: ag.id, schoolCode: code, deviceId: DEV, choice, role, position, reason: maskPI(reason), link, code: makeCode(), createdAt: Date.now() };
    S.entries.push(e); save(); return e;
  },
  async editEntry(e, f) {
    if (LIVE) { await rpc('edit_entry', { p_id: e.id, p_choice: f.choice, p_position: f.position, p_reason: f.reason, p_link: f.link }); return refreshAll(); }
    const nr = maskPI(f.reason);
    if (e.reason && nr !== e.reason) e.edited = true;
    Object.assign(e, f, { reason: nr }); save();
  },
  async withdraw(e) {
    if (LIVE) { await rpc('withdraw_entry', { p_id: e.id }); return refreshAll(); }
    S.entries = S.entries.filter(x => x !== e); save();
  },
  async addComment(ag, text, position) {
    if (LIVE) { await rpc('add_comment', { p_agenda: ag.id, p_body: text, p_position: position }); return refreshAll(); }
    S.comments.push({ id: 'c' + uid(), agendaId: ag.id, schoolCode: mySchool().code, deviceId: DEV, text: maskPI(text), position, createdAt: Date.now(), code: makeCode() }); save();
  },
  async editComment(c, text, position) {
    if (LIVE) { await rpc('edit_comment', { p_id: c.id, p_body: text, p_position: position }); return refreshAll(); }
    const nt = maskPI(text); if (nt !== c.text) c.edited = true;
    Object.assign(c, { text: nt, position }); save();
  },
  async deleteComment(c) {
    if (LIVE) { await rpc('delete_comment', { p_id: c.id }); return refreshAll(); }
    S.comments = S.comments.filter(x => x !== c); save();
  },
  async editAgenda(ag, f) {
    if (LIVE) { await rpc('edit_agenda', { p_agenda: ag.id, p_title: f.title, p_descr: f.desc, p_category: f.cat, p_options: f.options }); return refreshAll(); }
    if (participatedOf(ag)) fail('LOCKED');
    if (JSON.stringify(f.options) !== JSON.stringify(ag.options)) S.entries = S.entries.filter(e => e.agendaId !== ag.id);
    Object.assign(ag, { title: f.title, desc: maskPI(f.desc), category: f.cat, options: f.options }); save();
  },
  async deleteMyAgenda(ag) {
    if (LIVE) { await rpc('delete_my_agenda', { p_agenda: ag.id }); return refreshAll(); }
    if (participatedOf(ag)) fail('LOCKED');
    S.agendas = S.agendas.filter(a => a !== ag);
    S.entries = S.entries.filter(e => e.agendaId !== ag.id);
    S.comments = S.comments.filter(c => c.agendaId !== ag.id); save();
  },
  async addNote(ag, body) {
    if (LIVE) { await rpc('add_agenda_note', { p_agenda: ag.id, p_body: body }); return refreshAll(); }
    ag.notes = ag.notes || [];
    if (ag.notes.length >= 5) fail('NOTE_LIMIT');
    ag.notes.push({ body: maskPI(body), at: Date.now() }); save();
  },
  async requestTakedown(ag, reason) {
    if (LIVE) { await rpc('request_takedown', { p_agenda: ag.id, p_reason: reason }); return refreshAll(); }
    ag.takedown = true; save();
  },
  async toggleLike(id) {
    if (LIVE) { await rpc('toggle_like', { p_target: id }); return refreshAll(); }
    const a = S.likes[id] = S.likes[id] || []; const i = a.indexOf(DEV);
    if (i >= 0) a.splice(i, 1); else a.push(DEV); save();
  },
  async report(id) {
    if (LIVE) { const n = await rpc('report_item', { p_target: id }); await refreshAll(); return n; }
    const a = S.reports[id] = S.reports[id] || [];
    if (a.includes(DEV)) fail('ALREADY_REPORTED');
    a.push(DEV); save(); return a.length;
  },
  async curious(ag, school) {
    if (LIVE) { const n = await rpc('add_curious', { p_agenda: ag.id, p_school: school }); await refreshAll(); return n; }
    const ms = mySchool(); const code = school || (ms && ms.code);
    if (!code) fail('NO_SCHOOL');
    bindSchool(code);
    if (ag.curious.includes(code)) { save(); fail('ALREADY_CURIOUS'); }
    ag.curious.push(code);
    if (ag.curious.length >= 3) ag.status = 'open';
    save(); return ag.curious.length;
  },
  async createAgenda(f, school) {
    if (LIVE) {
      const id = await rpc('create_agenda', { p_title: f.title, p_descr: f.desc, p_category: f.cat, p_options: f.options, p_prev: f.prevId, p_school: school });
      await refreshAll(); return id;
    }
    const ms = mySchool(); const code = school || (ms && ms.code);
    if (!code) fail('NO_SCHOOL');
    bindSchool(code);
    const ag = { id: 'a' + uid(), year: CUR_YEAR, category: f.cat, title: f.title, desc: maskPI(f.desc), options: f.options, createdAt: Date.now(), status: 'pending', curious: [code], prevId: f.prevId, authorDevice: DEV, short: localShort(), code: makeCode(), notes: [] };
    S.agendas.push(ag); save(); return ag.id;
  },
  async claim(code, agendaId) {
    if (LIVE) { const r = await rpc('claim_code', { p_code: code }); await refreshAll(); return r.agenda_id; }
    const ag = S.agendas.find(x => x.code === code);
    if (ag) { ag.authorDevice = DEV; save(); return ag.id; }
    const cm = S.comments.find(x => x.code === code);
    if (cm) { cm.deviceId = DEV; save(); return cm.agendaId; }
    const e = S.entries.find(x => x.code === code);
    if (!e) fail('BAD_CODE');
    if (S.entries.some(x => x.agendaId === e.agendaId && x.deviceId === DEV && x !== e)) fail('ALREADY');
    e.deviceId = DEV;
    if (!mySchool()) S.deviceSchool[DEV] = { code: e.schoolCode, year: CUR_YEAR, changes: 0 };
    save(); return e.agendaId;
  },
  async changeSchool(code) {
    if (LIVE) { await rpc('change_school', { p_school: code }); return refreshAll(); }
    const cur = S.deviceSchool[DEV];
    if (cur && cur.year === CUR_YEAR && cur.code !== code && (cur.changes || 0) >= 1) fail('SCHOOL_LOCKED');
    bindSchool(code); save();
  }
};

function urlFor(view, id) {
  const d = DEMO && HAS_CONFIG ? 'demo' : '';   // 체험 주소는 이동해도 체험 모드 유지
  let q = '';
  if (view === 'agenda') { const ag = getAg(id); q = ag && ag.short ? 'q=' + ag.short : 'a=' + encodeURIComponent(id); }
  else if (view === 'new') q = 'new';
  else if (view === 'my') q = 'my';
  else if (view === 'admin') q = 'admin';
  else if (view === 'judge') q = 'judge';
  q = [q, d].filter(Boolean).join('&');
  return q ? '?' + q : location.pathname;
}
function go(view, id = null, push = true) {
  if (view === 'agenda' && ST.id !== id) { F = { region: null, level: '', confirmed: false }; OPSORT = 'like'; }
  ST.view = view; ST.id = id;
  if (push) {
    try { history.pushState({ view, id }, '', urlFor(view, id)); }
    catch (e) { try { history.pushState({ view, id }, ''); } catch (_) { } }
  }
  closeSheet(); render(); window.scrollTo(0, 0);
}
function parseLoc() {
  const p = new URLSearchParams(location.search);
  if (p.get('q')) { const code = p.get('q').trim().toUpperCase(); const ag = S && S.agendas.find(a => a.short === code); return { view: 'agenda', id: ag ? ag.id : 'missing' }; }
  if (p.get('a')) return { view: 'agenda', id: p.get('a') };
  if (p.has('new')) return { view: 'new', id: null };
  if (p.has('my')) return { view: 'my', id: null };
  if (p.has('admin')) return { view: 'admin', id: null };
  if (p.has('judge')) return { view: 'judge', id: null };
  return { view: 'home', id: null };
}

function tileMap(ag, rows) {

    if (rr.length < 3) return `<button class="tile ${F.region === rg.n ? 'sel' : ''}" style="${pos}" data-act="fRegion" data-v="${rg.n}" aria-label="${rg.n} ${rr.length}개교">${rg.n}<small>${rr.length ? rr.length + '개교' : '-'}</small></button>`;
    const c = ag.options.map((_, i) => rr.filter(r => r.choice === i).length);

    const op = .55 + .45 * (rr.length / maxN);
    return `<button class="tile has ${F.region === rg.n ? 'sel' : ''}" style="${pos};background:${COLORS[top]};opacity:${op.toFixed(2)}" data-act="fRegion" data-v="${rg.n}" aria-label="${rg.n} ${esc(ag.options[top])} 다수, ${rr.length}개교">${rg.n}<small>${rr.length}개교</small></button>`;

function compareBlock(prev, ag) {

      return `<div><div class="o">${esc(l)}</div>

        <div class="ln"><span>${ag.year}</span><div class="tr"><i style="width:${cv}%;background:${col}"></i></div><span>${cv}%</span></div></div>`;

  const ops = opinionsOf(ag);
  const maj = sm.total ? sm.counts.indexOf(Math.max(...sm.counts)) : -1;
  const minor = ops.filter(o => o.choice !== null && o.choice !== maj && likeN(o.id) >= 3 && !blinded(o.id))
    .sort((x, y) => likeN(y.id) - likeN(x.id)).slice(0, 1);
  const sorted = [...ops].sort((x, y) => OPSORT === 'like' ? likeN(y.id) - likeN(x.id) || y.at - x.at : y.at - x.at);
  let h = `<section class="card sec">
    <div class="between"><h2 style="font-size:18px;font-weight:800">판단 이유 <span class="muted" style="font-weight:600">${ops.length}</span></h2>
      <div class="row"><button class="chip ${OPSORT === 'like' ? 'on' : ''}" data-act="opsort" data-v="like">공감순</button><button class="chip ${OPSORT === 'new' ? 'on' : ''}" data-act="opsort" data-v="new">최신순</button></div></div>`;
  if (minor.length) {
    const o = minor[0];
    h += `<div class="minor"><div class="k">${IC.bulb} 주목할 소수의견 · '${esc(ag.options[o.choice])}' 선택</div>
      <q>${esc(o.text)}</q>
      <div class="between small muted"><span>${who(o)}</span>${likeBtn(o)}</div></div>`;
  }
  h += `<div class="ops">${sorted.length ? sorted.map(o => opItem(ag, o)).join('') : '<div class="empty small">아직 남겨진 이유가 없어요. 첫 의견을 남겨 주세요.</div>'}</div></section>`;
  return h;
}
function who(o) { const sc = SMAP[o.code]; return `${sc ? sc.region : ''}${o.position ? ' · ' + esc(o.position) : ' · 직위 미공개'}`; }
function likeBtn(o) { const on = (S.likes[o.id] || []).includes(DEV); return `<button class="like ${on ? 'on' : ''}" data-act="like" data-id="${o.id}" aria-pressed="${on}">${IC.thumb} 논리적이에요 ${likeN(o.id)}</button>`; }
function opItem(ag, o) {
  const admDel = IS_ADMIN ? `<button class="rep" style="color:#C92A2A" data-act="admDelItem" data-id="${o.id}">삭제</button>` : '';
  if (blinded(o.id)) return `<div class="op"><p class="blind">신고가 누적되어 가려진 의견이에요.</p>${admDel ? `<div class="ft"><span></span>${admDel}</div>` : ''}</div>`;
  const badge = o.choice === null ? `<span class="pill">의견</span>` : `<span class="pill" style="background:${COLORS[o.choice]}1F;color:${COLORS[o.choice]}">${esc(ag.options[o.choice])}</span>`;
  const url = safeUrl(o.link);
  return `<div class="op">
    <div class="top">${badge}${ROLE_LABEL[o.role] && o.role !== 'comment' ? `<span class="pill ${o.role === 'object' ? 'warn' : 'ok'}">${ROLE_LABEL[o.role]}</span>` : ''}${o.mine ? '<span class="pill mine">내 글</span>' : ''}</div>
    <p class="txt">${esc(o.text)}</p>
    ${url ? `<a class="lk" href="${esc(url)}" target="_blank" rel="noopener nofollow">${IC.link}${esc(url)}</a>` : ''}
    <div class="ft"><span>${who(o)} · ${when(o)}${o.edited ? ' · 수정됨' : ''}</span><span class="row">${likeBtn(o)}${o.mine
      ? (o.role === 'comment' ? `<button class="rep" style="color:var(--pri-ink)" data-act="editComment" data-id="${o.id}">수정</button><button class="rep" data-act="delComment" data-id="${o.id}">삭제</button>` : `<button class="rep" style="color:var(--pri-ink)" data-act="editVote">수정</button>`)
      : `<button class="rep" data-act="report" data-id="${o.id}">신고</button>`}${admDel}</span></div>
  </div>`;
}

function renderSim() {
  const box = $('#simBox'); if (!box) return;
  const t = NEWF.title.trim();
  if (t.length < 4) { box.innerHTML = ''; return; }
  const scored = S.agendas.map(a => ({ a, s: sim(t, a.title) })).filter(x => x.s >= .25).sort((x, y) => y.s - x.s).slice(0, 4);
  const same = scored.filter(x => x.a.year === CUR_YEAR);
  const past = scored.filter(x => x.a.year < CUR_YEAR && !S.agendas.some(b => b.prevId === x.a.id));
  if (!same.length && !past.length) { box.innerHTML = ''; return; }
  box.innerHTML = `<div class="sim">
    ${same.length ? `<div class="h">올해 비슷한 안건이 있어요. 혹시 이건가요?</div>${same.map(x => `<div class="it"><span>${esc(x.a.title)}</span><button class="link" data-act="open" data-id="${x.a.id}">보러 가기</button></div>`).join('')}` : ''}
    ${past.length ? `<div class="h" style="${same.length ? 'margin-top:10px' : ''}">작년에 열린 비슷한 안건</div>${past.map(x => `<div class="it"><span>${x.a.year}학년도 · ${esc(x.a.title)}</span><button class="link" data-act="usePrev" data-id="${x.a.id}">이어서 열기</button></div>`).join('')}` : ''}
  </div>`;
}

function submitVote(btn) {
  const ag = voteSheet._ag, edit = voteSheet._edit;
  const ms = mySchool();
  const chEl = document.querySelector('input[name="vChoice"]:checked');
  const { reason, link, pos, linkBad } = readReason();
  const prob = contentProblem(reason); showProblem('eBad', prob); if (prob) return;
  const useBound = !!(ms && !PICK._changing);
  const hasSchool = edit || useBound || PICK.vote;
  showErr('eSchool', !hasSchool); showErr('eChoice', !chEl); showErr('eLink', linkBad);
  if (!hasSchool || !chEl || linkBad) return;
  const choice = +chEl.value;
  if (edit) return run(btn, async () => { await API.editEntry(edit, { choice, position: pos, reason, link }); closeSheet(); render(); toast('바꿨어요'); });
  run(btn, async () => {
    try {
      const e = await API.castVote(ag, { school: useBound ? null : PICK.vote, choice, role: 'origin', position: pos, reason, link });
      delete PICK._changing; delete PICK.vote;
      doneSheet(e);
    } catch (err) {
      if (errKey(err) !== 'SCHOOL_EXISTS') throw err;
      delete PICK._changing; delete PICK.vote;
      closeSheet(); render(); toast(ERR.SCHOOL_EXISTS);
    }
  });
}

  const fwd = `${FORWARD_TO[ag.category] || FORWARD_TO['기타']} 전달해 주시면 더욱 감사하겠습니다.`;

  } else if (ag.status === 'pending') {             // 공개 전: 궁금해요 모으기
    short = `[옆 학교는?] 다른 학교는 어떻게 하시나요?\n${ag.title}\n같은 고민이 있으면 '우리도 궁금해요'를 눌러 주세요. 3개교가 모이면 투표가 열려요.`;
    formal = `[옆 학교는?] 다른 학교의 판단을 여쭙니다\n\n안녕하세요. 학교마다 판단이 갈리는 업무가 있어 여러 학교의 의견을 모으려 합니다.\n\n○ 질문: ${ag.title}\n○ 다른 학교 3곳이 '우리도 궁금해요'를 누르면 투표가 열립니다.\n○ ${easy}\n\n${fwd}\n참여하기: ${link}`;
  } else if (n >= MIN_SCHOOLS) {                    // 결과 공개 뒤: 알림
    short = `[옆 학교는?] 다른 학교들의 판단이 모였어요\n${ag.title}\n${n}개교가 참여했어요. 결과와 판단 이유를 볼 수 있어요.`;
    formal = `[옆 학교는?] 다른 학교들의 판단이 모였습니다\n\n○ 질문: ${ag.title}\n○ ${n}개교가 참여했고, 결과와 판단 이유를 볼 수 있습니다.\n○ 아직 참여하지 않으셨다면 귀교의 판단도 더해 주세요. ${easy}\n\n${fwd}\n바로 보기: ${link}`;
  } else {                                          // 투표 중: 참여 요청
    short = `[옆 학교는?] 다른 학교는 어떻게 하시나요?\n${ag.title}\n학교명만 고르면 1분이면 돼요(로그인 없음, 학교 이름 비공개).`;
    formal = `[옆 학교는?] 다른 학교의 판단을 여쭙니다\n\n안녕하세요. 학교마다 판단이 갈리는 업무가 있어 여러 학교의 의견을 모으고 있습니다.\n\n○ 질문: ${ag.title}\n○ ${n ? `현재 ${n}개교가 참여했습니다. ` : ''}${MIN_SCHOOLS}개교 이상 모이면 결과가 공개됩니다.\n○ ${easy}\n\n${fwd}\n참여하기: ${link}`;
  }
  return { link, kakaoText: short, kakao: `${short}\n▶ ${link}`, msg: formal };

    showErr('eSchool', !ms && !school); showErr('eCat', !NEWF.cat); showErr('eTitle', title.length < 8); showErr('eOpt', opts.length < 2 || !uniq);
    const prob = contentProblem([title, NEWF.desc, ...opts].join(' ')); showProblem('eBadNew', prob);
    if ((!ms && !school) || !NEWF.cat || title.length < 8 || opts.length < 2 || !uniq || prob) { const f = document.querySelector('.err.on'); if (f) f.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
    const dup = S.agendas.filter(a => a.year === CUR_YEAR).map(a => ({ a, s: sim(title, a.title) })).sort((x, y) => y.s - x.s)[0];

        <div class="sim" style="margin-top:12px"><div class="it"><span>${esc(dup.a.title)}</span></div></div>
        <div class="foot"><button class="btn" data-act="forceNew">그래도 등록</button><button class="btn pri" data-act="open" data-id="${dup.a.id}">기존 안건 보기</button></div>`);
      return;

    <div class="f"><span class="lbl">현재 기기</span><div class="picked"><span class="small"><b>${esc(DEV)}</b><br>${mySchool() ? esc(mySchool().sc.name) : '학교 미선택'}</span></div></div>
    <div class="f" style="display:grid;gap:8px">
      <button class="btn dark block" data-act="newDevice">새 기기로 전환 (다른 선생님)</button>

    </div>
    ${LIVE ? '<p class="small" style="margin:12px 0 0;color:#B42424">실서비스 모드예요. 여기서 남긴 표는 실제 데이터로 저장돼요.</p>' : ''}
    <p class="small muted" style="margin:14px 0 0">같은 학교 흐름 시험: ① 투표 → ② 새 기기로 전환 → ③ 같은 학교로 투표하거나 안건 화면에서 확인·이의신청</p>
    <div class="foot" style="grid-template-columns:1fr"><button class="btn" data-act="closeSheet">닫기</button></div>`),

    <div class="foot" style="grid-template-columns:1fr"><button class="btn" data-act="closeSheet">닫기</button></div>`)

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  if (t.tagName === 'A') return;
  e.preventDefault();
  const fn = ACT[t.dataset.act]; if (fn) fn(t, e);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'jText') { JDG.text = t.value; showErr('eJ', false); return; }
  if (t.id === 'q') { H.q = t.value; renderHomeList(); return; }
  if (t.dataset.schoolSearch) {
    const key = t.dataset.schoolSearch;
    const toks = t.value.trim().split(/\s+/).filter(Boolean).map(w => w.replace(/초$/, '초등').replace(/중$/, '중학').replace(/고$/, '고등'));
    const box = document.getElementById('plist-' + key);
    if (!toks.length) { box.style.display = 'none'; return; }
    const hits = [];
    for (const s of SCHOOLS) {
      const hay = s.region + ' ' + (s.addr || '') + ' ' + s.name;
      if (toks.every(w => hay.includes(w))) { hits.push(s); if (hits.length >= 40) break; }
    }
    box.style.display = 'block';
    box.innerHTML = hits.length ? hits.map(s => `<button data-act="pickSchool" data-for="${key}" data-code="${s.code}"><span>${esc(s.name)}</span><small>${esc(s.region)}${s.addr ? ' ' + esc(s.addr) : ''}</small></button>`).join('') : `<div class="small muted" style="padding:10px 13px">검색 결과가 없어요</div>`;
    return;
  }
  if (t.dataset.new === 'title') { NEWF.title = t.value; renderSim(); showErr('eTitle', false); }
  else if (t.dataset.new === 'desc') NEWF.desc = t.value;
  else if (t.dataset.newOpt !== undefined) { NEWF.options[+t.dataset.newOpt] = t.value; showErr('eOpt', false); }
  if (t.name === 'vChoice') showErr('eChoice', false);
  liveCheck();
});
function liveCheck() {   // 입력하는 동안 욕설·학교 이름을 바로 안내
  if ($('#nTitle')) showProblem('eBadNew', contentProblem([NEWF.title, NEWF.desc, ...NEWF.options].join(' ')));
  if ($('#vReason')) showProblem('eBad', contentProblem($('#vReason').value));
  if ($('#cText')) showProblem('eBad', contentProblem($('#cText').value));
  if ($('#ecText')) showProblem('eBad', contentProblem($('#ecText').value));
  if ($('#noteIn')) showProblem('eBad', contentProblem($('#noteIn').value));
  if ($('#eaTitle')) showProblem('eBad', contentProblem([$('#eaTitle').value, $('#eaDesc').value, ...[...document.querySelectorAll('[data-ea-opt]')].map(i => i.value)].join(' ')));
}
document.addEventListener('change', e => {
  const t = e.target;
  if (t.classList && t.classList.contains('jadd') && t.value) { const c = JDG.crit[t.dataset.k]; c.areas = [...(c.areas || []), t.value]; render(); return; }
  if (t.id === 'jBook') { JDG.book = t.value; render(); return; }
  if (t.id === 'yearSel') { H.year = t.value; renderHomeList(); }
  else if (t.id === 'sortSel') { H.sort = t.value; renderHomeList(); }
  else if (t.id === 'fConf') { F.confirmed = t.checked; render(); }
  else if (t.dataset.new === 'cat') { NEWF.cat = t.value; showErr('eCat', false); }
  else if (t.name === 'vChoice') showErr('eChoice', false);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#sheet').classList.contains('on')) closeSheet(); });
window.addEventListener('scroll', () => $('#hdr').classList.toggle('scrolled', scrollY > 4), { passive: true });
function copyText(t, msg) {
  const ok = () => toast(msg);
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(ok).catch(fallback); else fallback();
  function fallback() { const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); ok(); } catch (_) { toast('복사하지 못했어요. 직접 적어 두세요'); } ta.remove(); }
}

/* ---------- 시작 ---------- */
(async () => {
  if (DEMO) {
    document.body.classList.add('demo');
    $('#demobar').innerHTML = `체험 모드 · 여기 보이는 안건과 숫자는 모두 예시예요${HAS_CONFIG ? `<a href="${location.pathname}">실제 서비스로 가기 →</a>` : ''}`;
  }
  const DEVMODE = !LIVE || new URLSearchParams(location.search).has('dev');
  if (!DEVMODE) document.querySelector('.devbtn').style.display = 'none';
  $('#app').innerHTML = '<div class="empty sec">불러오는 중…</div>';
  await loadSchools();
  if (LIVE) {
    try { await initLive(); }
    catch (e) {
      console.error(e);
      $('#app').innerHTML = '<div class="card empty sec"><b>서버에 연결하지 못했어요</b><p class="small" style="margin:6px 0 14px">잠시 후 새로고침해 주세요.</p><button class="btn sm" onclick="location.reload()">새로고침</button></div>';
      return;
    }
    // 다른 탭이나 앱을 보다 돌아오면 최신 결과로 새로 고침
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && !$('#sheet').classList.contains('on') && ST.view !== 'new') refreshAll().then(render).catch(() => { });
    });
  } else load();
  const s = parseLoc(); ST.view = s.view; ST.id = s.id;
  try { history.replaceState(s, ''); } catch (e) { }
  render();
})();
